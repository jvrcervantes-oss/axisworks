<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Bienvenido a AxisWorks!</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#15181C;color:#F4F2EC;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.6}
  .x{color:#E2581C;font-weight:700}
  .eyebrow{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.2em;font-size:.72rem;color:#E2581C;margin-bottom:1.4em}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(2rem,5vw,3rem);margin-bottom:.4em;letter-spacing:-.02em}
  p{color:#9AA0A8;max-width:480px;margin:0 auto 1.6em}
  a{display:inline-block;background:#E2581C;color:#fff;text-decoration:none;padding:13px 28px;border-radius:999px;font-weight:600}
</style>
</head>
<body>
  <div>
    <p class="eyebrow">Suscripción activa</p>
    <h1>¡Bienvenido a Axis<span class="x">✕</span>Works!</h1>
    <p>Tu suscripción está activa. En las próximas 24h te escribimos para empezar con tu web. Gracias por confiar en nosotros.</p>
    <a href="https://axisworks.studio">Volver a la web</a>
  </div>
</body>
</html>
