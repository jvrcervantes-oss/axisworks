<!-- ════════════════════════════════════════════════════════════════════
     AxisWorks — Widget de chatbot comercial
     Pega TODO este bloque justo antes de </body> en index.html.
     Backend: comercial/chatbot/chat.php  (ajusta AX_CHAT_ENDPOINT si cambia).
     ════════════════════════════════════════════════════════════════════ -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  #ax-chat,#ax-chat *{box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
  #ax-launch{position:fixed;bottom:22px;right:22px;z-index:9998;width:60px;height:60px;border:none;border-radius:50%;
    background:#15181C;color:#F4F2EC;font-size:1.7rem;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.28);
    display:flex;align-items:center;justify-content:center;transition:transform .2s}
  #ax-launch:hover{transform:scale(1.06)}
  #ax-launch .x{color:#E2581C;font-family:'Space Grotesk',sans-serif;font-weight:700}
  #ax-chat{position:fixed;bottom:94px;right:22px;z-index:9999;width:360px;max-width:calc(100vw - 32px);
    height:520px;max-height:calc(100vh - 130px);background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.30);display:none;flex-direction:column}
  #ax-chat.open{display:flex}
  .ax-head{background:#15181C;color:#F4F2EC;padding:16px 18px;display:flex;align-items:center;gap:10px}
  .ax-head .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84}
  .ax-head b{font-family:'Space Grotesk',sans-serif;font-size:1rem}
  .ax-head .x{color:#E2581C;font-weight:700}
  .ax-head small{color:#9AA0A8;display:block;font-size:.72rem;margin-top:1px}
  .ax-close{margin-left:auto;background:none;border:none;color:#9AA0A8;font-size:1.3rem;cursor:pointer;line-height:1}
  .ax-body{flex:1;overflow-y:auto;padding:18px;background:#F4F2EC;display:flex;flex-direction:column;gap:10px}
  .ax-msg{max-width:84%;padding:10px 14px;border-radius:14px;font-size:.92rem;line-height:1.45;white-space:pre-wrap}
  .ax-bot{background:#fff;border:1px solid #e6e4dd;align-self:flex-start;border-bottom-left-radius:4px}
  .ax-user{background:#15181C;color:#F4F2EC;align-self:flex-end;border-bottom-right-radius:4px}
  .ax-typing{align-self:flex-start;color:#9AA0A8;font-size:.85rem;padding:4px 6px}
  .ax-foot{display:flex;gap:8px;padding:12px;border-top:1px solid #e6e4dd;background:#fff}
  .ax-foot input{flex:1;border:1px solid #e6e4dd;border-radius:10px;padding:11px 13px;font-size:.92rem;outline:none}
  .ax-foot input:focus{border-color:#E2581C}
  .ax-foot button{border:none;background:#E2581C;color:#fff;border-radius:10px;padding:0 16px;font-weight:600;cursor:pointer}
  .ax-foot button:disabled{opacity:.5;cursor:default}
  @media(prefers-reduced-motion:reduce){#ax-launch{transition:none}}
</style>

<button id="ax-launch" aria-label="Abrir chat">✕</button>
<div id="ax-chat" role="dialog" aria-label="Chat de AxisWorks">
  <div class="ax-head">
    <span class="dot"></span>
    <div><b>Axis<span class="x">✕</span>Works</b><small>Normalmente responde al instante</small></div>
    <button class="ax-close" aria-label="Cerrar">×</button>
  </div>
  <div class="ax-body" id="ax-body"></div>
  <form class="ax-foot" id="ax-form">
    <input id="ax-input" type="text" placeholder="Escribe tu mensaje…" autocomplete="off" maxlength="500">
    <button type="submit" id="ax-send">Enviar</button>
  </form>
</div>

<script>
(function(){
  var AX_CHAT_ENDPOINT = '/comercial/chatbot/chat.php';
  var GREETING = '¡Hola! 👋 Soy el asistente de AxisWorks. ¿Tienes ya una web o estás empezando? Cuéntame de tu negocio y te preparo una vista previa gratis.';

  var launch=document.getElementById('ax-launch'),
      panel=document.getElementById('ax-chat'),
      body=document.getElementById('ax-body'),
      form=document.getElementById('ax-form'),
      input=document.getElementById('ax-input'),
      send=document.getElementById('ax-send'),
      closeBtn=panel.querySelector('.ax-close'),
      history=[], started=false;

  function add(role,text){
    var d=document.createElement('div');
    d.className='ax-msg '+(role==='user'?'ax-user':'ax-bot');
    d.textContent=text; body.appendChild(d); body.scrollTop=body.scrollHeight;
  }
  function typing(on){
    var t=document.getElementById('ax-typing');
    if(on){ if(!t){t=document.createElement('div');t.id='ax-typing';t.className='ax-typing';t.textContent='escribiendo…';body.appendChild(t);body.scrollTop=body.scrollHeight;} }
    else if(t){ t.remove(); }
  }
  function open(){
    panel.classList.add('open'); launch.style.display='none'; input.focus();
    if(!started){ started=true; add('bot',GREETING); history.push({role:'assistant',content:GREETING}); }
  }
  function close(){ panel.classList.remove('open'); launch.style.display='flex'; }

  launch.addEventListener('click',open);
  closeBtn.addEventListener('click',close);

  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var txt=input.value.trim(); if(!txt) return;
    add('user',txt); history.push({role:'user',content:txt});
    input.value=''; send.disabled=true; typing(true);
    fetch(AX_CHAT_ENDPOINT,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:history})
    })
    .then(function(r){return r.json()})
    .then(function(d){
      typing(false);
      var reply=(d&&d.reply)?d.reply:'Disculpa, ha habido un problema. ¿Me dejas tu email y te escribimos?';
      add('bot',reply); history.push({role:'assistant',content:reply});
    })
    .catch(function(){
      typing(false);
      add('bot','Ahora mismo no puedo responder. Escríbenos a hello@axisworks.studio y te ayudamos.');
    })
    .finally(function(){ send.disabled=false; input.focus(); });
  });
})();
</script>
<!-- ═══════════════════ fin widget AxisWorks ═══════════════════ -->
