<script>
/*AXW_ASIS_INI*/
/* Asistente «Nuevo ERP» (2-oct-2026, encargos/20261002_erp_asistente_instalacion.md, subtarea 5). TODO lo que decide el
   asistente está en este bloque y no toca el navegador (ni DOM, ni fetch, ni almacenamiento): un estado, un reductor puro,
   las vistas como texto HTML y un almacén que recibe `pide` desde fuera. Por eso lo ejecuta tal cual la prueba
   asistente_instalacion.test.js (extrae lo que hay entre los marcadores AXW_ASIS_INI y AXW_ASIS_FIN).
   Fuente de las listas: `estado.perfiles` de la edge erp-control (que sale de erp/perfiles.json). Ningún módulo, país,
   zona horaria, tope ni regla de impuestos está escrito aquí: se pinta lo que llega. Lo único propio son los rótulos
   (cómo se llama cada clave en pantalla) y los textos de ayuda.
   Lo que valida este bloque es AYUDA para no mandar un formulario roto: el servidor (edge y RPC) lo vuelve a validar
   todo y manda. «No te creas nada del front-end»: la pantalla no calcula dependencias ni claves derivadas. */
window.AXW_ASIS = (function () {
  'use strict';
  var PASOS = 4;
  var TITULOS = ['Tipo de ERP', 'Módulos', 'Ajustes', 'Resumen y envío'];
  var CORTO = ['Tipo', 'Módulos', 'Ajustes', 'Resumen'];
  // qué paso muestra cada campo que la edge/RPC puede señalar en su 400 (`campos`)
  var PASO_DE = { instancia: 1, instancia_existe: 1, marca: 1, dominio: 1, correo_admin: 1, tipo: 1, perfil_bloqueado: 1, modulos: 2, ajustes: 3 };
  var BASE = [
    { k: 'instancia', et: 'Nombre interno', ph: 'cliente-nuevo', max: 30, ayuda: 'Minúsculas, números y guiones. Identifica la instancia; no lo ve el cliente.' },
    { k: 'marca', et: 'Nombre del ERP (marca)', ph: 'Cliente S.L.', max: 60 },
    { k: 'dominio', et: 'Dominio o subdominio', ph: 'erp.cliente.com', max: 253 },
    { k: 'correo_admin', et: 'Correo del superadmin', ph: 'direccion@cliente.com', max: 254, tipo: 'email', ayuda: 'La cuenta tiene que existir antes de lanzar el alta.' }
  ];
  // Rótulos de las claves de ajustes (presentación). Una clave nueva sin entrada sale con su nombre y un campo de texto.
  var ETIQ = {
    zona_horaria: ['Zona horaria', 'Opcional. La hora que usa el ERP para fechas y vencimientos.'],
    impuestos_aplica: ['¿El ERP saca impuestos?', 'Obligatorio. Si sí, se crea UN impuesto por defecto con el nombre y el porcentaje que pongas; se cambia después en Ajustes → Impuestos.'],
    impuesto_nombre: ['Nombre del impuesto', ''],
    impuesto_pct: ['Porcentaje (%)', ''],
    sociedad_nombre: ['Nombre de la sociedad emisora', ''],
    sociedad_pais: ['País de la sociedad', ''],
    sociedad_prefijo_serie: ['Prefijo de la serie de facturas', '']
  };
  // El nombre de un país sale del propio código (ICU del navegador), no de una lista escrita aquí: los códigos que se ofrecen los manda el servidor.
  // Un valor de dos letras mayúsculas se lee como código de país.
  function pais(c) {
    try { return new Intl.DisplayNames(['es'], { type: 'region' }).of(c) || c; } catch (x) { /* MUDO A PROPOSITO: sin Intl se enseña el código tal cual; el valor que se manda es el código, no el nombre */ return c; }
  }
  var SECC = { zona_horaria: 'general', impuestos_aplica: 'impuestos', impuesto_nombre: 'impuestos', impuesto_pct: 'impuestos' };
  var SECC_TIT = { general: 'Región', impuestos: 'Impuestos', sociedad: 'Sociedad emisora', otros: 'Otros ajustes' };
  var SECC_ORDEN = ['general', 'impuestos', 'sociedad', 'otros'];
  var CONTROL = /[\u0000-\u001f\u007f]/;
  var DOMINIO = /^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$/;
  var CORREO = /^[^@\s'"\\\u0000-\u001f]+@[^@\s'"\\\u0000-\u001f]+\.[a-z]{2,}$/;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function tiene(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function str(x) { return typeof x === 'string' ? x : ''; }
  function catalogoValido(c) {
    return !!c && Array.isArray(c.tipos) && c.tipos.length > 0 && !!c.ajustes && typeof c.ajustes === 'object' &&
      !!c.ajustes_reglas && Array.isArray(c.ajustes_reglas.obligatorios) && Array.isArray(c.ajustes_reglas.cruzadas);
  }
  function perfilDe(cat, tipo) {
    var l = (cat && cat.tipos || []).filter(function (t) { return t.tipo === tipo; });
    return l.length ? l[0] : null;
  }
  function etiq(k) { return (ETIQ[k] || [k, ''])[0]; }

  // ── estado ──────────────────────────────────────────────────────────────────────────────────────
  function nuevo(cat, existentes) {
    var e = { cat: cat, existentes: existentes || [], paso: 1, errores: {}, servidor: null, enviando: false, seq: null, hecho: null,
      sinCatalogo: !catalogoValido(cat), v: { instancia: '', marca: '', dominio: '', correo_admin: '', tipo: '', opc: {}, aj: {} } };
    if (!e.sinCatalogo) Object.keys(cat.ajustes).forEach(function (k) { e.v.aj[k] = cat.ajustes[k].tipo === 'booleano' ? null : ''; });
    return e;
  }
  function clona(e) {
    var n = {};
    Object.keys(e).forEach(function (k) { n[k] = e[k]; });
    n.v = {}; Object.keys(e.v).forEach(function (k) { n.v[k] = e.v[k]; });
    n.v.opc = {}; Object.keys(e.v.opc).forEach(function (k) { n.v.opc[k] = e.v.opc[k]; });
    n.v.aj = {}; Object.keys(e.v.aj).forEach(function (k) { n.v.aj[k] = e.v.aj[k]; });
    n.errores = {}; Object.keys(e.errores).forEach(function (k) { n.errores[k] = e.errores[k]; });
    return n;
  }

  // ── reglas entre ajustes (ajustes_reglas, del servidor) ────────────────────────────────────────────
  function activa(e, r) { return tiene(e.v.aj, r.si) && e.v.aj[r.si] === r.es; }
  function vacio(x) { return x === null || x === undefined || x === ''; }
  // visible: no prohibida por una regla activa; y si es condicional (alguna regla la prohíbe), solo mientras otra regla la exija
  function visible(e, k) {
    var prohibida = false, condicional = false, exigida = false;
    e.cat.ajustes_reglas.cruzadas.forEach(function (r) {
      var on = activa(e, r);
      if ((r.prohibe || []).indexOf(k) !== -1) { condicional = true; if (on) prohibida = true; }
      if ((r.exige || []).indexOf(k) !== -1 && on) exigida = true;
    });
    return !prohibida && (!condicional || exigida);
  }
  // requerido: obligatorio, exigido por una regla activa, o miembro de un grupo (sociedad) del que ya hay algún dato / alguna clave exigida
  function requeridos(e) {
    var req = {}, aj = e.cat.ajustes;
    e.cat.ajustes_reglas.obligatorios.forEach(function (k) { req[k] = true; });
    e.cat.ajustes_reglas.cruzadas.forEach(function (r) { if (activa(e, r)) (r.exige || []).forEach(function (k) { req[k] = true; }); });
    var grupos = {};
    Object.keys(aj).forEach(function (k) { if (aj[k].grupo) (grupos[aj[k].grupo] = grupos[aj[k].grupo] || []).push(k); });
    Object.keys(grupos).forEach(function (g) {
      var pide = grupos[g].some(function (k) { return visible(e, k) && (req[k] || !vacio(e.v.aj[k])); });
      if (pide) grupos[g].forEach(function (k) { req[k] = true; });
    });
    Object.keys(req).forEach(function (k) { if (!tiene(aj, k) || !visible(e, k)) delete req[k]; });
    return req;
  }
  function limpio(rule, x) {
    if (typeof x !== 'string') return x;
    var t = x.trim();
    return rule.tipo === 'decimal' ? t.replace(',', '.') : t;
  }
  function validaValor(k, rule, x) {
    if (rule.tipo === 'booleano') return typeof x === 'boolean' ? null : 'Elige sí o no.';
    if (typeof x !== 'string' || CONTROL.test(x)) return 'Valor no válido.';
    if (rule.tipo === 'enum') return (rule.valores || []).indexOf(x) !== -1 ? null : 'Elige una opción de la lista.';
    if (rule.tipo === 'regex') {
      if (new RegExp(rule.patron || '$^').test(x) && /^[\u0001-\u007f]*$/.test(x)) return null;
      var m = /\{(\d+),(\d+)\}/.exec(rule.patron || '');
      return 'Formato no válido: mayúsculas y números' + (m ? ', de ' + m[1] + ' a ' + m[2] + ' caracteres' : '') + '.';
    }
    if (rule.tipo === 'decimal') {
      var ok = new RegExp(rule.patron || '$^').test(x) && Number(x) > Number(rule.mayor_que) && Number(x) <= Number(rule.hasta);
      return ok ? null : 'Un número mayor que ' + rule.mayor_que + ' y como mucho ' + rule.hasta + ', con hasta 2 decimales (con punto o coma).';
    }
    if (rule.tipo === 'texto') {
      var n = x.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, '_').length;   // caracteres, no unidades UTF-16: como length() de Postgres
      if (n < (rule.min || 0) || n > (rule.max || 0)) return 'Entre ' + rule.min + ' y ' + rule.max + ' caracteres.';
      if (/[<>]/.test(x) || (rule.patron !== undefined && !new RegExp(rule.patron).test(x))) return 'Contiene caracteres no permitidos.';
      return null;
    }
    return 'Ajuste desconocido.';
  }

  // ── validación por paso (AYUDA: el servidor decide) ───────────────────────────────────────────────
  function valida(e, paso) {
    var errs = {}, v = e.v, p = perfilDe(e.cat, v.tipo);
    if (paso === 1) {
      var i = v.instancia.trim(), m = v.marca.trim(), d = v.dominio.trim().toLowerCase(), c = v.correo_admin.trim().toLowerCase();
      if (!/^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(i) || i.length < 3 || i.length > 30) errs.instancia = 'Entre 3 y 30 caracteres: minúsculas, números y guiones, empezando por letra.';
      else if (e.existentes.indexOf(i) !== -1) errs.instancia = 'Ya existe una instancia con ese nombre.';
      if (m.length < 2 || m.length > 60 || CONTROL.test(m)) errs.marca = 'Entre 2 y 60 caracteres.';
      if (d.length > 253 || !DOMINIO.test(d)) errs.dominio = 'Escribe un dominio válido.';
      if (c.length > 254 || !CORREO.test(c)) errs.correo_admin = 'Escribe un correo válido.';
      if (!p) errs.tipo = 'Elige un tipo de ERP.';
      else if (!p.comprobado) errs.tipo = 'Este tipo de ERP aún no se puede pedir.';
    }
    if (paso === 2) {
      if (!p) errs.tipo = 'Elige primero el tipo de ERP.';
      else {
        var total = p.modulos.length + p.modulos_opcionales.filter(function (k) { return v.opc[k]; }).length;
        if (e.cat.tope_modulos && total > e.cat.tope_modulos) errs.modulos = 'Demasiados módulos: como mucho ' + e.cat.tope_modulos + '.';
      }
    }
    if (paso === 3) {
      var req = requeridos(e);
      Object.keys(e.cat.ajustes).forEach(function (k) {
        if (!visible(e, k)) return;
        var rule = e.cat.ajustes[k], x = v.aj[k];
        if (vacio(x)) { if (req[k]) errs['aj:' + k] = rule.tipo === 'booleano' ? 'Elige sí o no.' : 'Obligatorio.'; return; }
        var msg = validaValor(k, rule, limpio(rule, x));
        if (msg) errs['aj:' + k] = msg;
      });
    }
    return errs;
  }
  function primerFallo(e) {
    for (var p = 1; p <= 3; p++) { var er = valida(e, p); if (Object.keys(er).length) return { paso: p, errores: er }; }
    return null;
  }

  // ── lo que se manda ─────────────────────────────────────────────────────────────────────────────
  function modulosElegidos(e) {
    var p = perfilDe(e.cat, e.v.tipo);
    if (!p) return [];
    return p.modulos.concat(p.modulos_opcionales.filter(function (k) { return e.v.opc[k]; }));
  }
  function ajustesAMandar(e) {
    var out = {};
    Object.keys(e.cat.ajustes).forEach(function (k) {
      if (!visible(e, k)) return;
      var x = e.v.aj[k];
      if (vacio(x)) return;
      out[k] = limpio(e.cat.ajustes[k], x);
    });
    return out;
  }
  function cuerpo(e) {
    var v = e.v;
    return { accion: 'alta', instancia: v.instancia.trim(), marca: v.marca.trim(), dominio: v.dominio.trim().toLowerCase(),
      correo_admin: v.correo_admin.trim().toLowerCase(), tipo: v.tipo, modulos: modulosElegidos(e), ajustes: ajustesAMandar(e) };
  }

  // ── la respuesta de la edge ─────────────────────────────────────────────────────────────────────
  var CAMPO_MSG = {
    instancia: 'El servidor no acepta este nombre interno.', instancia_existe: 'Ya existe una instancia con ese nombre.', marca: 'El servidor no acepta este nombre.',
    dominio: 'El servidor no acepta este dominio.', correo_admin: 'El servidor no acepta este correo.'
  };
  function interpreta(estado, d) {
    d = d && typeof d === 'object' ? d : {};
    if (estado === 200 && d.solicitud !== undefined && d.solicitud !== null) return { ok: true, solicitud: d.solicitud };
    var r = { ok: false, mensajes: [], campos: [], errores: {}, paso: null };
    var campos = Array.isArray(d.campos) ? d.campos.filter(function (c) { return typeof c === 'string'; }) : [];
    var detalle = Array.isArray(d.detalle) ? d.detalle.filter(function (c) { return typeof c === 'string'; }).slice(0, 6) : [];

    return '<div id="asis-aviso" role="alert" tabindex="-1" class="rounded-lg bg-error-container p-space-sm font-body-sm text-body-sm text-on-error-container space-y-1">' +
      e.servidor.mensajes.map(function (m) { return '<p>' + esc(m) + '</p>'; }).join('') + '</div>';
  }
  function vistaHecho(e) {
    return '<div id="asis-aviso" role="status" tabindex="-1" class="rounded-lg bg-secondary-container p-space-md text-on-secondary-container space-y-1">' +
      '<p class="font-label-md text-label-md">Solicitud #' + esc(e.hecho.solicitud) + ' guardada.</p>' +
      '<p class="font-body-sm text-body-sm">Queda como solicitud, no se ha creado nada. El estudio la lanza con <code>--desde-solicitud ' + esc(e.hecho.solicitud) + '</code>; crear el proyecto (unos 10 $/mes) te pedirá el OK.</p>' +
      '<p class="font-body-sm text-body-sm">' + esc(textoRecordatorio(e)) + '</p></div>';
  }

  function stepper(e) {
    return '<ol class="flex items-center gap-space-xs" aria-label="Pasos del asistente">' + CORTO.map(function (t, i) {
      var n = i + 1, ya = n < e.paso, ahora = n === e.paso && !e.hecho;
      var cuerpoPaso = '<span class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full font-code-metric text-code-metric ' + (ahora ? 'bg-primary-container text-on-primary' : (ya || e.hecho ? 'bg-secondary-container text-on-secondary-container' : 'bg-surface-container text-on-surface-variant')) + '">' + n + '</span>' +
        '<span class="' + (ahora ? '' : 'hidden sm:inline ') + 'font-label-md text-label-md ' + (ahora ? 'text-on-surface' : 'text-on-surface-variant') + '">' + esc(t) + '</span>';
      var item = ya && !e.enviando && !e.hecho
        ? '<button type="button" data-accion="ir" data-paso="' + n + '" class="inline-flex items-center gap-space-xs rounded-lg px-1" aria-label="Volver al paso ' + n + ': ' + esc(TITULOS[i]) + '">' + cuerpoPaso + '</button>'
        : '<span class="inline-flex items-center gap-space-xs px-1"' + (ahora ? ' aria-current="step"' : '') + '>' + cuerpoPaso + '</span>';
      return '<li class="flex items-center gap-space-xs">' + item + (n < PASOS ? '<span class="h-px w-4 bg-outline-variant" aria-hidden="true"></span>' : '') + '</li>';
    }).join('') + '</ol>';
  }
  function pie(e) {
    if (e.hecho) {
      return '<button type="button" data-accion="reinicia" class="' + CLS_BTN + ' bg-surface-container text-on-surface">Pedir otro ERP</button>' +
        '<button type="button" data-accion="cierra" class="' + CLS_BTN + ' bg-primary-container text-on-primary">Cerrar</button>';
    }
    var ult = e.paso === PASOS;
    return '<button type="button" data-accion="cierra" class="' + CLS_BTN + ' bg-surface-container text-on-surface mr-auto">Cerrar</button>' +
      (e.paso > 1 ? '<button type="button" data-accion="atras" class="' + CLS_BTN + ' bg-surface-container-high text-on-surface"' + (e.enviando ? ' disabled' : '') + '>Atrás</button>' : '') +
      '<button type="submit" data-accion="' + (ult ? 'envia' : 'avanza') + '" class="' + CLS_BTN + ' bg-primary-container text-on-primary' + (e.enviando ? ' opacity-60 cursor-wait' : '') + '"' + (e.enviando ? ' disabled aria-busy="true"' : '') + '>' +
      (ult ? (e.enviando ? 'Enviando…' : 'Pedir el alta') : 'Siguiente') + '</button>';
  }
  function vista(e, nombre) {
    nombre = nombre || function (k) { return k; };
    var cabeza = '<div class="shrink-0 space-y-space-sm border-b border-outline-variant/40 p-space-md">' + (e.sinCatalogo ? '' : stepper(e)) +
      '<h2 id="asis-titulo" tabindex="-1" class="font-headline-sm text-headline-sm font-bold text-on-surface">Nuevo ERP' + (e.sinCatalogo || e.hecho ? '' : ' · ' + esc(TITULOS[e.paso - 1])) + '</h2></div>';
    if (e.sinCatalogo) {
      return cabeza + '<div class="min-h-0 flex-1 overflow-y-auto p-space-md font-body-md text-body-md text-on-surface">El mando todavía no publica los tipos de ERP (la función erp-control del estudio no está actualizada), así que no se puede pedir un alta desde aquí.</div>' +
        '<div class="shrink-0 flex justify-end gap-space-sm border-t border-outline-variant/40 p-space-md"><button type="button" data-accion="cierra" class="' + CLS_BTN + ' bg-primary-container text-on-primary">Cerrar</button></div>';
    }
    var cuerpoHtml = e.hecho ? vistaHecho(e) : banner(e) + [vistaTipo, vistaModulos, vistaAjustes, vistaResumen][e.paso - 1](e, nombre);
    return cabeza + '<div class="min-h-0 flex-1 overflow-y-auto p-space-md space-y-space-md">' + cuerpoHtml + '</div>' +
      '<div class="shrink-0 flex flex-wrap items-center justify-end gap-space-sm border-t border-outline-variant/40 p-space-md">' + pie(e) + '</div>';
  }

  function errId(c) { return 'err-' + idDe(c); }
  return { PASOS: PASOS, errId: errId, nuevo: nuevo, reduce: reduce, crea: crea, valida: valida, cuerpo: cuerpo, interpreta: interpreta, vista: vista, esc: esc,
    requeridos: requeridos, visible: visible, modulosElegidos: modulosElegidos, catalogoValido: catalogoValido };
})();
/*AXW_ASIS_FIN*/
</script>
<script>
(function () {
  /* Nombre, sección e icono de cada clave del registro (erp/modulos.json). Solo presentación: la lista de módulos,
     sus dependencias y lo que está activo vienen de la base. Una clave nueva sin entrada sale con su clave.
     Lo pone build.py desde modulos_rotulos.json (28-sep-2026): la misma tabla que usa la pantalla «Módulo no instalado». */
  var ROTULO = __AXW_ROTULOS__;
  var SECCIONES = ['Seguimiento', 'Documentación', 'Finanzas', 'Comunicación', 'Base de datos', 'Otros'];
  function rot(k) { return ROTULO[k] || [k, 'Otros', 'extension']; }
  function nombre(k) { return rot(k)[0]; }
  function lista(ks) { return ks.map(nombre).join(', '); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ms(n, c) { return '<span class="material-symbols-outlined ' + (c || '') + '" aria-hidden="true">' + n + '</span>'; }
  function $(id) { return document.getElementById(id); }
  var tT;
  function toast(t) { var b = $('toast'); b.textContent = t; b.classList.remove('hidden'); clearTimeout(tT); tT = setTimeout(function () { b.classList.add('hidden'); }, 4000); }

  var sb = null, instancias = [], actual = null, ocupado = false, perfiles = null, cargaSeq = 0;

  function pide(cuerpo) {
    return sb.auth.getSession().then(function (s) {
      var t = s && s.data && s.data.session && s.data.session.access_token;
      return fetch(window.lwEdge('erp-control'), { method: 'POST',
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (t || '') }, body: JSON.stringify(cuerpo) });
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { d.__estado = r.status; return d; });
    });
  }

  function activosDe(inst) {
    var e = inst.estado;
    if (!e) return [];
    if (e.activos === null) return e.modulos.map(function (m) { return m.modulo; });   // sin lista = todo encendido
    return e.activos.slice();
  }

  // ── pintar ──────────────────────────────────────────────────────────────────────────────────
  function pintaLista() {
    $('lista-instancias').innerHTML = instancias.map(function (i) {
      var sel = actual && i.nombre === actual.nombre;
      return '<button type="button" data-inst="' + esc(i.nombre) + '" class="w-full text-left flex items-center gap-space-sm px-space-sm py-space-sm rounded-lg ' +
        (sel ? 'bg-primary-container text-on-primary' : 'text-on-surface-variant hover:bg-surface-container hover:text-on-surface') + '"' +
        (sel ? ' aria-current="true"' : '') + '>' + ms(i.editable ? 'dns' : 'lock', 'text-[20px]') +
        '<span class="min-w-0"><span class="block font-label-md text-label-md truncate">' + esc(i.marca) + '</span>' +
        '<span class="block font-code-metric text-code-metric opacity-80 truncate">' + esc(i.dominio || i.nombre) + '</span></span></button>';
    }).join('');
    $('sel-instancia').innerHTML = instancias.map(function (i) {
      return '<option value="' + esc(i.nombre) + '"' + (actual && i.nombre === actual.nombre ? ' selected' : '') + '>' + esc(i.marca) + '</option>';
    }).join('');
  }

  /* Ficha (lectura): lo que la instancia USA hoy, leído de su base. El dueño de nombre y dominio es erp/instancias.json
     (el instalador lo copia a la base) y el de los superadmins, Auth: por eso se cambian con el instalador, no aquí
     (rev. previa #143, Datos #1/#2). Si la base y el registro del mando no dicen lo mismo, se avisa. */
  function fila(et, val, nota) {
    return '<div class="grid grid-cols-[120px_1fr] gap-space-sm py-1"><dt class="font-label-sm text-label-sm uppercase tracking-wider text-outline">' + et +
      '</dt><dd class="min-w-0 font-body-sm text-body-sm text-on-surface [overflow-wrap:anywhere]">' + val + (nota ? '<div class="font-code-metric text-code-metric text-on-surface-variant">' + nota + '</div>' : '') + '</dd></div>';
  }
  function pintaFicha(i, e) {
    var caja = $('ficha');
    if (!e || !e.ficha) { caja.classList.add('hidden'); caja.innerHTML = ''; return; }
    var f = e.ficha, avisos = [];
    if (f.marca && i.marca && f.marca !== i.marca) avisos.push('El registro del mando dice «' + esc(i.marca) + '»: se igualan al relanzar el paso control.');
    if (f.dominio_web && i.dominio && i.dominio !== f.dominio_web && i.dominio.indexOf(f.dominio_web) === -1) avisos.push('El dominio del ERP en el registro es ' + esc(i.dominio) + '.');
    var admins = (f.super_admins || []).map(function (a) {
      return esc(a.correo) + (a.confirmado ? '' : ' <span class="text-error">· sin confirmar</span>') +
        (a.difiere ? ' <span class="text-error">· su ficha de usuario tiene otro correo</span>' : '');
    }).join('<br>') || '<span class="text-error">Ninguno activo</span>';
    caja.classList.remove('hidden');
    caja.innerHTML = '<h2 class="font-label-sm text-label-sm uppercase tracking-wider text-outline mb-space-xs">Ficha</h2><dl>' +
      fila('Nombre', esc(f.marca || '—'), 'Lo cambia el estudio en el registro y el instalador lo lleva a la base.') +
      fila('Dominio', esc(f.dominio_web || '—'), 'Cambiarlo es DNS y republicar: lo hace el estudio.') +
      fila('Intranet', esc(f.url_intranet || '—'), '') +
      fila('Superadmin', admins, 'Alta: el estudio con el instalador (la cuenta tiene que existir antes).') +
      '</dl>' + (avisos.length ? '<p class="mt-space-xs font-body-sm text-body-sm text-error">' + avisos.join(' ') + '</p>' : '');
  }

  function pintaInstancia() {
    var i = actual, e = i.estado, aviso = $('aviso-instancia');
    var act = activosDe(i);
    $('cabecera-instancia').innerHTML =
      '<div class="flex flex-wrap items-center justify-between gap-space-sm">' +
      '<div class="min-w-0"><div class="font-headline-sm text-headline-sm font-bold text-on-surface">' + esc(i.marca) + '</div>' +
      '<div class="font-code-metric text-code-metric text-on-surface-variant">' + esc(i.dominio || i.nombre) + '</div></div>' +
      (e ? '<div class="flex flex-wrap gap-space-xs">' +
        '<span class="px-space-sm py-[2px] rounded-full bg-secondary-container text-on-secondary-container font-code-metric text-code-metric font-semibold">' + act.length + ' módulos activos</span>' +
        '<span class="px-space-sm py-[2px] rounded-full bg-surface-container text-on-surface-variant font-code-metric text-code-metric font-semibold">' + (e.apagados || 0) + ' objetos cerrados en la base</span>' +
        '</div>' : '') + '</div>';
    if (!i.editable) {
      aviso.classList.remove('hidden');
      aviso.innerHTML = ms('lock', 'align-middle text-[20px] mr-1') + '<strong>No se controla desde aquí.</strong> ' + esc(i.motivo || 'Esta instancia no tiene llave de control.');
    } else if (!e) {
      aviso.classList.remove('hidden');
      aviso.innerHTML = ms('cloud_off', 'align-middle text-[20px] mr-1') + esc(i.error || 'La instancia no responde ahora mismo.') +
        ' <button type="button" id="reintenta" class="underline font-label-md">Reintentar</button>';
    } else aviso.classList.add('hidden');

    pintaFicha(i, e);
    var cont = $('modulos');
    if (!e) { cont.innerHTML = ''; $('historial').innerHTML = ''; return; }
    var desplegadas = e.edges_desplegadas || [];
    var porSeccion = {};
    e.modulos.forEach(function (m) {
      if (m.modulo === 'base') return;
      var s = rot(m.modulo)[1];
      (porSeccion[s] = porSeccion[s] || []).push(m);
    });
    cont.innerHTML = SECCIONES.filter(function (s) { return porSeccion[s]; }).map(function (s) {
      return '<div><h2 class="font-label-sm text-label-sm uppercase tracking-wider text-outline mb-space-sm">' + esc(s) + '</h2><div class="grid gap-space-sm sm:grid-cols-2">' +
        porSeccion[s].sort(function (a, b) { return nombre(a.modulo).localeCompare(nombre(b.modulo), 'es'); }).map(function (m) {
          var on = act.indexOf(m.modulo) !== -1;
          var faltanEdges = (m.edges || []).filter(function (x) { return desplegadas.indexOf(x) === -1; });
          var nota = !m.instalable ? 'No instalado. ' + (m.motivo || 'Este módulo aún no existe como producto para esta instancia.') : (!on && faltanEdges.length ? 'Faltan funciones por desplegar' : (m.depende.length ? 'Necesita: ' + lista(m.depende) : 'Sin dependencias'));
          var bloqueado = !i.editable || (!on && !m.instalable);
          return '<div class="rounded-xl p-space-md bg-surface-container-lowest shadow-sm flex items-start justify-between gap-space-sm' + (on ? '' : ' opacity-80') + '">' +
            '<div class="flex items-start gap-space-sm min-w-0"><div class="p-space-xs rounded-lg shrink-0 ' + (on ? 'bg-primary-container text-on-primary' : 'bg-surface-container-low text-on-surface-variant') + '">' + ms(rot(m.modulo)[2], 'text-[22px]') + '</div>' +
            '<div class="min-w-0"><div class="font-label-md text-label-md text-on-surface">' + esc(nombre(m.modulo)) + '</div>' +
            '<div class="font-code-metric text-code-metric text-on-surface-variant">' + esc(nota) + '</div></div></div>' +
            '<button class="tgl shrink-0 w-12 h-6 rounded-full p-1 flex items-center ' + (on ? 'bg-primary-container' : 'bg-surface-container-highest') + (bloqueado ? ' cursor-not-allowed opacity-50' : '') +
            '" type="button" role="switch" aria-checked="' + on + '" aria-label="' + (on ? 'Apagar ' : 'Encender ') + esc(nombre(m.modulo)) + '"' +
            (bloqueado ? ' disabled' : '') + ' data-mod="' + esc(m.modulo) + '"><span class="w-4 h-4 bg-surface-container-lowest rounded-full shadow-sm" style="transform:translateX(' + (on ? '24px' : '0') + ')"></span></button></div>';
        }).join('') + '</div></div>';
    }).join('');
    $('historial').innerHTML = (e.log || []).map(function (l) {
      var d = new Date(l.cuando);
      return '<li class="p-space-sm rounded-lg bg-surface-container-lowest font-body-sm text-body-sm"><span class="font-code-metric text-code-metric text-on-surface-variant">' +
        esc(d.toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' })) + ' · ' + esc(l.quien) + '</span><div class="text-on-surface [overflow-wrap:anywhere]">' + esc(String(l.resumen || '').replace(/,/g, ', ')) + '</div></li>';
    }).join('') || '<li class="font-body-sm text-body-sm text-on-surface-variant">Sin cambios registrados.</li>';
  }

  function elige(nombreInst) {
    for (var k = 0; k < instancias.length; k++) if (instancias[k].nombre === nombreInst) actual = instancias[k];
    pintaLista();
    pintaInstancia();
  }

  function carga(mantener) {
    var mi = ++cargaSeq;   // una respuesta vieja no pisa a la nueva (dos cargas seguidas: la última manda)
    return pide({ accion: 'estado' }).then(function (d) {
      if (mi !== cargaSeq) return;
      if (d.__estado === 403) throw new Error('Tu cuenta no es operadora del panel de control.');
      if (d.__estado !== 200 || !Array.isArray(d.instancias)) throw new Error('El mando no responde (' + d.__estado + ').');
      instancias = d.instancias;
      perfiles = d.perfiles || null;
      var sigue = mantener && actual && actual.nombre;
      actual = null;
      $('estado-carga').classList.add('hidden');
      $('vista').classList.remove('hidden');
      elige(sigue || (instancias.filter(function (i) { return i.editable; })[0] || instancias[0] || {}).nombre);
    });
  }

  // ── cambiar: simular en la base, confirmar, aplicar ───────────────────────────────────────────
  function dialogo(html, ok, alt) {
    $('dlg-cuerpo').innerHTML = html;
    $('dlg-ok').textContent = ok || 'Aplicar';
    $('dlg-ok').classList.toggle('hidden', !ok);
    $('dlg-alt').textContent = alt || '';
    $('dlg-alt').classList.toggle('hidden', !alt);
    var dlg = $('dlg');
    dlg.returnValue = '';
    dlg.showModal();
    return new Promise(function (r) { dlg.addEventListener('close', function f() { dlg.removeEventListener('close', f); r(dlg.returnValue); }); });
  }

  function propone(activos, mod, enciende) {
    return pide({ accion: 'simula', instancia: actual.nombre, activos: activos }).then(function (d) {
      if (d.__estado !== 200 || !d.simulacion) throw new Error(d.mensaje || 'No se pudo simular el cambio (' + d.__estado + ').');
      var s = d.simulacion, bloqueos = [];
      if ((s.no_instalables || []).length) bloqueos.push('No están instalados en esta base: ' + esc(lista(s.no_instalables)) + '.');
      var ef = Object.keys(s.edges_faltan || {});
      if (ef.length) bloqueos.push('A ' + esc(lista(ef)) + ' le faltan funciones por desplegar (' + esc([].concat.apply([], ef.map(function (k) { return s.edges_faltan[k]; })).join(', ')) +
        '). Las prepara el estudio (quedan cerradas hasta encenderlo): ' + ef.map(function (k) { return '<code>python erp/nueva_instancia.py ' + esc(actual.nombre) + ' --aplica --paso edges --modulo ' + esc(k) + '</code>'; }).join(' · ') + '.');
      if ((s.desconocidos || []).length) bloqueos.push('Módulos que la base no conoce: ' + esc(s.desconocidos.join(', ')) + '.');
      var cambios = '<p>' + (s.enciende.length ? '<strong>Se enciende:</strong> ' + esc(lista(s.enciende)) + '<br>' : '') +
        (s.apaga.length ? '<strong>Se apaga:</strong> ' + esc(lista(s.apaga)) : '') + '</p>';
      if (bloqueos.length) return dialogo(cambios + bloqueos.map(function (b) { return '<p class="text-error">' + b + '</p>'; }).join(''), null).then(function () { return null; });
      var faltan = s.faltan_dependencias || {}, fk = Object.keys(faltan);
      if (fk.length) {
        var sugerido = enciende ? s.sugerido_con_dependencias : s.sugerido_sin_dependientes;
        var texto = enciende
          ? '<p>' + esc(nombre(mod)) + ' necesita otros módulos para funcionar:</p><ul class="list-disc pl-5">' + fk.map(function (k) { return '<li>' + esc(nombre(k)) + ' usa ' + esc(lista(faltan[k])) + '</li>'; }).join('') + '</ul>'
          : '<p>Otros módulos encendidos usan ' + esc(nombre(mod)) + ':</p><ul class="list-disc pl-5">' + fk.map(function (k) { return '<li>' + esc(nombre(k)) + ' usa ' + esc(lista(faltan[k])) + '</li>'; }).join('') + '</ul>';
        var extra = enciende
          ? sugerido.filter(function (k) { return activos.indexOf(k) === -1; })
          : activos.filter(function (k) { return sugerido.indexOf(k) === -1 && k !== mod; });
        // sin nada más que añadir o quitar, no hay salida automática (p. ej. lo que arrastra no se puede encender)
        if (!extra.length) return dialogo(texto + '<p>No hay una combinación que lo resuelva sola: cambia primero los módulos que lo usan.</p>', null).then(function () { return null; });
        texto += '<p>' + (enciende ? 'Se puede encender junto con: ' : 'Se puede apagar junto con: ') + '<strong>' + esc(lista(extra)) + '</strong>.</p>';
        return dialogo(texto, null, enciende ? 'Encender todo' : 'Apagar todo').then(function (v) {
          return v === 'alt' ? propone(sugerido, mod, enciende) : null;
        });
      }
      return dialogo(cambios + '<p class="font-body-sm text-body-sm text-on-surface-variant">Se aplica al momento en la base de ' + esc(actual.marca) +
        ': lo apagado deja de responder y desaparece del menú al recargar.</p>', 'Aplicar').then(function (v) { return v === 'ok' ? activos : null; });
    });
  }

  function alterna(mod) {
    if (ocupado || !actual || !actual.editable || !actual.estado) return;
    var act = activosDe(actual), on = act.indexOf(mod) !== -1;
    var deseado = on ? act.filter(function (k) { return k !== mod; }) : act.concat([mod]);
    ocupado = true;
    propone(deseado, mod, !on).then(function (final) {
      if (!final) return;
      return pide({ accion: 'cambia', instancia: actual.nombre, activos: final }).then(function (d) {
        if (d.__estado === 200 && d.aplicado) {
          var a = d.aplicado;
          toast('Aplicado' + (a.enciende.length ? ' · encendido: ' + lista(a.enciende) : '') + (a.apaga.length ? ' · apagado: ' + lista(a.apaga) : ''));
          return carga(true);
        }
        if (d.error === 'ocupado') toast(d.mensaje);
        else if (d.error === 'rechazado') toast('La base lo ha rechazado: vuelve a intentarlo, el estado ha cambiado.');
        else toast(d.mensaje || 'Respuesta inesperada (' + d.__estado + '). Recargo el estado para ver qué quedó.');
        return carga(true);
      });
    }).catch(function (e) { toast(e.message); }).then(function () { ocupado = false; });
  }

  /* Nuevo ERP (asistente de 4 pasos, 2-oct-2026, encargos/20261002_erp_asistente_instalacion.md): solo deja una SOLICITUD en
     la base del mando (la valida la edge y otra vez la base). El alta real la lanza el estudio:
     `python erp/nueva_instancia.py --desde-solicitud <n>`; crear el proyecto es gasto y sigue pidiendo tu OK.
     Toda la lógica vive en AXW_ASIS (bloque de arriba, sin DOM); aquí solo se conecta con la pantalla: el estado es SUYO y
     lo de aquí es cola. La lista de tipos, módulos, zonas y reglas es `estado.perfiles` (la edge), nunca texto de esta página. */
  var asis = null, asisPaso = 0, asisSilencio = false;
  function asisPinta() {
    var e = asis.estado(), raiz = $('asis-raiz'), act = document.activeElement, idAct = act && act.id && raiz.contains(act) ? act.id : '';
    raiz.innerHTML = window.AXW_ASIS.vista(e, nombre);
    var cambioPaso = asisPaso !== e.paso;
    asisPaso = e.paso;
    if (cambioPaso || e.hecho) { var t = $('asis-titulo'); if (t) t.focus(); }
    else if (idAct && $(idAct)) $(idAct).focus();   // el repintado no le quita el foco a quien está tocando un radio o una casilla
  }
  function asisFirma(e) {
    return JSON.stringify([e.paso, e.errores, e.servidor, e.enviando, e.hecho, e.v.tipo, e.v.aj.impuestos_aplica, Object.keys(e.v.opc).length, e.sinCatalogo]);
  }
  function asisEfecto(antes, ahora) {
    if (asisSilencio) return;   // escribir en un campo de texto no repinta (perdería el cursor); el oyente de entrada limpia lo suyo
    if (antes.cat !== ahora.cat || asisFirma(antes) !== asisFirma(ahora)) {
      asisPinta();
      // un error nuevo, un aviso del servidor o el «guardada» llevan el foco a lo que hay que mirar
      var nuevoAviso = JSON.stringify([antes.errores, antes.servidor]) !== JSON.stringify([ahora.errores, ahora.servidor]);
      if ((nuevoAviso && (Object.keys(ahora.errores).length || ahora.servidor)) || (ahora.hecho && !antes.hecho)) {
        var malo = $('asis-raiz').querySelector('[aria-invalid="true"]') || $('asis-aviso');
        if (malo) malo.focus();
      }
    }
    if (!antes.hecho && ahora.hecho) {
      toast('Solicitud #' + ahora.hecho.solicitud + ' guardada. Queda como solicitud: el estudio la lanza con --desde-solicitud ' + ahora.hecho.solicitud + ' y crear el proyecto te pedirá el OK.');
    }
  }
  function asisAbre() {
    var ref = instancias.map(function (i) { return i.nombre; });
    if (asis) asis.despacha({ t: 'catalogo', cat: perfiles, existentes: ref });
    else asis = window.AXW_ASIS.crea(perfiles, ref, pide, asisEfecto);
    if (asis.estado().hecho) asis.despacha({ t: 'reinicia' });
    asisPaso = 0;
    asisPinta();
    var d = $('asis');
    if (!d.open) d.showModal();
  }
  function asisAccion(t) {
    var a = t.getAttribute('data-accion');
    if (a === 'abre-asistente') return asisAbre();
    if (a === 'cierra') { $('asis').close(); return; }   // el borrador se queda en memoria; el POST en vuelo, si lo hay, sigue y avisa por toast
    if (!asis) return;
    if (a === 'ir') asis.despacha({ t: 'ir', paso: t.getAttribute('data-paso') });
    else asis.despacha({ t: a });
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest && ev.target.closest('[data-accion],[data-mod],[data-inst],#reintenta');
    if (!t) return;
    if (t.hasAttribute('data-accion')) { ev.preventDefault(); if (!t.disabled) asisAccion(t); }
    else if (t.id === 'reintenta') carga(true).catch(function (e) { toast(e.message); });
    else if (t.hasAttribute('data-inst')) elige(t.getAttribute('data-inst'));
    else if (!t.disabled) alterna(t.getAttribute('data-mod'));
  });
  $('sel-instancia').addEventListener('change', function () { elige(this.value); });
  $('asis-form').addEventListener('submit', function (ev) { ev.preventDefault(); });   // Enter dispara el clic del botón de enviar (data-accion), no el submit
  // un solo oyente de entrada para todo el asistente: texto, selects, radios y casillas; el campo lo dice data-campo / data-opc
  document.addEventListener('input', function (ev) {
    var c = ev.target.closest && ev.target.closest('#asis [data-campo],#asis [data-opc]');
    if (!c || !asis) return;
    if (c.hasAttribute('data-opc')) asis.despacha({ t: 'opc', modulo: c.getAttribute('data-opc'), on: c.checked });
    else if (c.getAttribute('data-campo') === 'tipo') asis.despacha({ t: 'tipo', tipo: c.value });
    else {
      asisSilencio = c.type !== 'radio';   // un radio (¿saca impuestos?) cambia lo que se ve: repinta; el texto y las listas no
      asis.despacha({ t: 'campo', campo: c.getAttribute('data-campo'), valor: c.value });
      asisSilencio = false;
      if (c.type !== 'radio') {   // al escribir se quita el aviso de ese campo y el del servidor sin repintar
        var m = $(window.AXW_ASIS.errId(c.getAttribute('data-campo'))), av = $('asis-aviso');
        if (m) m.classList.add('hidden');
        c.removeAttribute('aria-invalid');
        if (av && !asis.estado().servidor) av.remove();
      }
    }
  });

  window.LW_AUTH.then(function (a) {
    sb = a.sb;
    $('operador').textContent = (a.session && a.session.user && a.session.user.email) || '—';
    return carga(false);
  }).catch(function (e) {
    $('estado-carga').textContent = e.message || 'No se pudo cargar el panel.';
  });
})();
</script>
</body>
