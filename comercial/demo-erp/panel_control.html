     módulos; erp.css + tokens del artifact): marco de noche, zona de trabajo Chalk, Unbounded / Manrope / IBM Plex Mono. Las fuentes van
     DENTRO de la página (data:, las pone build.py en el hueco de abajo): producción solo sirve /panel/index.html y /panel/panel.css, y nada
     se pide a Google para la marca. Todo con clases ax-* de aquí: panel.css (Tailwind compilado) lo comparten Pilotos y Aprobaciones y

  function filaPaso(k, p, final) {

      if (sd.tipo === 'pasos') { nPasos += sd.pasos.length; sd.pasos.forEach(function (p) { filas.push(filaPaso(k, p, final)); }); return; }

    var t = {
      modulo_de_otro_tipo: 'es de otro tipo de ERP: esta instancia no lo puede encender',
      modulo_de_pago: 'es de pago: lo enciende su propia ventana, no este panel',
      tipos_sin_sembrar: 'la base aún no tiene sembrado de qué tipo es cada módulo',
      modulo_sin_declarar: 'hay módulos sin declarar en el registro de la base',
      sin_declarar_dueno: 'hay piezas sin dueño declarado en el registro de la base',
      modulos_activos_forma: 'la lista de módulos no tiene la forma que pide la base',
      cuentas_lectura_abierta: 'Cuentas no se enciende mientras su lectura siga abierta en esta base',
      cuenta_pruebas_solo_mira: 'la cuenta de pruebas solo puede mirar'
    }[String(r.codigo)];
    var piezas = Array.isArray(r.lista) && r.lista.length ? ' (' + e(r.lista.join(', ')) + ')' : '';
    return 'La base no lo enciende: ' + e(t || String(r.codigo || 'rechazo sin código')) + piezas + '. Ningún ensayo lo cambia.';
  }
  // regla_sin_mirar de erp_control_simula (096000, Seguridad #326-3): la base no pudo preguntar a sus disparadores; ok false, nunca verde
  var SIN_MIRAR = { disparador_apagado: 'el disparador de la regla de tipos está apagado', diferible: 'hay una regla que solo salta al confirmar',
    solo_lectura: 'la conexión es de solo lectura' };

  function propone(activos, mod, enciende, vuelta) {
    return pide({ accion: 'simula', instancia: actual.nombre, activos: activos }).then(function (d) {
      if (d.__estado !== 200 || !d.simulacion) throw new Error(d.mensaje || 'No se pudo simular el cambio (' + d.__estado + ').');
      var s = d.simulacion, bloqueos = [];
      if ((s.no_instalables || []).length) bloqueos.push('No están instalados en esta base: ' + esc(lista(s.no_instalables)) + '.');
      var ef = Object.keys(s.edges_faltan || {});
      if (ef.length) bloqueos.push('A ' + esc(lista(ef)) + ' le faltan funciones por desplegar (' + esc([].concat.apply([], ef.map(function (k) { return s.edges_faltan[k]; })).join(', ')) +
        '). Las prepara el estudio (quedan cerradas hasta encenderlo): ' + ef.map(function (k) { return '<code>python erp/nueva_instancia.py ' + esc(actual.nombre) + ' --aplica --paso edges --modulo ' + esc(k) + '</code>'; }).join(' · ') + '.');
      if ((s.desconocidos || []).length) bloqueos.push('Módulos que la base no conoce: ' + esc(s.desconocidos.join(', ')) + '.');
      var cf = s.condiciones_faltan && typeof s.condiciones_faltan === 'object' ? Object.keys(s.condiciones_faltan) : [];
      if (cf.length) bloqueos.push(cf.map(function (k) { var v = s.condiciones_faltan[k];
        return esc(nombre(k)) + ' no se puede encender todavía: le falta ' + esc(Array.isArray(v) ? v.join(', ') : String(v)) + ' (lo pide la base).'; }).join(' '));
      // A14 (20261014096000): lo que frenaría un disparador de la base (otro tipo, de pago, sin declarar…) va en `rechazo`. Va ANTES y TAPA la falta de
      // ensayo (EU4, 15-oct, rama de bbm): un rechazo así no lo arregla ningún ensayo, y pedir uno sería trabajo para nada
      var faltan = s.faltan_dependencias || {}, fk = Object.keys(faltan);
      if (s.rechazo && typeof s.rechazo === 'object') bloqueos.push(textoRechazo(s.rechazo));
      else if (s.regla_sin_mirar) bloqueos.push('La base no pudo comprobar este cambio (' + esc(SIN_MIRAR[s.regla_sin_mirar] || String(s.regla_sin_mirar)) +
        '): no se aplica desde aquí.');
      // EU4 (20261014097000): encender exige un ensayo en rama del conjunto exacto, registrado en la base (lo hace el estudio: rama_prueba --objetivo +
      // registra_ensayo). Solo frena el conjunto que se aplicaría: con dependencias por cerrar la base ensaya el conjunto incompleto, que siempre sale
      // sin ensayo, y el panel tiene que llegar a proponer el conjunto con lo que arrastra (revisor, 1.ª vuelta de a3d03af)
      else if (s.sin_ensayo && typeof s.sin_ensayo === 'object' && !fk.length) bloqueos.push('El estudio tiene que ensayar este conjunto de módulos antes de encenderlo' +
        (Array.isArray(s.sin_ensayo.conjunto) && s.sin_ensayo.conjunto.length ? ' (' + esc(s.sin_ensayo.conjunto.join(', ')) + ')' : '') + ': ' +
        esc(String(s.sin_ensayo.motivo || 'no hay ensayo')) + '.');
      var cambios = '<p>' + (s.enciende.length ? '<strong>Se enciende:</strong> ' + esc(lista(s.enciende)) + '<br>' : '') +
        (s.apaga.length ? '<strong>Se apaga:</strong> ' + esc(lista(s.apaga)) : '') + '</p>';
      if (bloqueos.length) return dialogo(cambios + bloqueos.map(function (b) { return '<p class="ax-error">' + b + '</p>'; }).join(''), null, null, 'No se puede aplicar').then(function () { return null; });
      // Encender con lo que arrastra: se vuelve a simular el conjunto que propone la base y se confirma UNA vez, enseñando qué se
      // enciende y qué setup trae cada uno (plan F3 punto 5). Solo una vuelta: si el conjunto propuesto sigue sin cerrar, no hay salida sola.
      if (fk.length && enciende && !vuelta) {
        var conDeps = (s.sugerido_con_dependencias || []).filter(function (k) { return activos.indexOf(k) === -1; });
        if (conDeps.length) return propone(s.sugerido_con_dependencias, mod, true, 1);
      }
      if (!fk.length && enciende) return confirmaEncendido(s, mod, activos);
      if (fk.length) {
        var sugerido = enciende ? s.sugerido_con_dependencias : s.sugerido_sin_dependientes;
        var texto = enciende
          ? '<p>' + esc(nombre(mod)) + ' necesita otros módulos para funcionar:</p><ul class="list-disc pl-5">' + fk.map(function (k) { return '<li>' + esc(nombre(k)) + ' usa ' + esc(lista(faltan[k])) + '</li>'; }).join('') + '</ul>'
          : '<p>Otros módulos encendidos usan ' + esc(nombre(mod)) + ':</p><ul class="list-disc pl-5">' + fk.map(function (k) { return '<li>' + esc(nombre(k)) + ' usa ' + esc(lista(faltan[k])) + '</li>'; }).join('') + '</ul>';
        var extra = enciende
          ? sugerido.filter(function (k) { return activos.indexOf(k) === -1; })
          : activos.filter(function (k) { return sugerido.indexOf(k) === -1 && k !== mod; });
        // sin nada más que añadir o quitar, no hay salida automática (p. ej. lo que arrastra no se puede encender)
        if (!extra.length) return dialogo(texto + '<p>No hay una combinación que lo resuelva sola: cambia primero los módulos que lo usan.</p>', null, null, 'No se puede aplicar').then(function () { return null; });
        texto += '<p>' + (enciende ? 'Se puede encender junto con: ' : 'Se puede apagar junto con: ') + '<strong>' + esc(lista(extra)) + '</strong>.</p>';
        return dialogo(texto, null, enciende ? 'Encender todo' : 'Apagar todo').then(function (v) {
          return v === 'alt' ? propone(sugerido, mod, enciende, 1) : null;
        });
      }
      return dialogo(cambios + '<p class="ax-md">Se aplica al momento en la base de ' + esc(actual.marca) +
        ': lo apagado deja de responder y desaparece del menú al recargar.</p>', 'Aplicar', null, 'Apagar ' + nombre(mod)).then(function (v) { return v === 'ok' ? activos : null; });
    });
  }

  function alterna(mod) {
    if (ocupado || !actual || !actual.editable || !actual.estado) return;
    var act = activosDe(actual), on = act.indexOf(mod) !== -1;
    var deseado = on ? act.filter(function (k) { return k !== mod; }) : act.concat([mod]);
    ocupado = true;
    propone(deseado, mod, !on).then(function (final) {
      if (!final) return;
      return pide({ accion: 'cambia', instancia: actual.nombre, activos: final }).then(function (d) {
        if (d.__estado === 200 && d.aplicado) {
          var a = d.aplicado;
          toast('Aplicado' + (a.enciende.length ? ' · encendido: ' + lista(a.enciende) : '') + (a.apaga.length ? ' · apagado: ' + lista(a.apaga) : ''));
          return carga(true);
        }
        if (d.error === 'ocupado') toast(d.mensaje);
        else if (d.error === 'rechazado' && d.motivo && d.motivo.sin_ensayo && typeof d.motivo.sin_ensayo === 'object')
          toast('La base no lo enciende: el estudio tiene que ensayar este conjunto antes (' + String(d.motivo.sin_ensayo.motivo || 'sin ensayo') + ').');
        else if (d.error === 'rechazado' && d.motivo && d.motivo.rechazo && typeof d.motivo.rechazo === 'object') toast(textoRechazo(d.motivo.rechazo, true));
        else if (d.error === 'rechazado') toast('La base lo ha rechazado: vuelve a intentarlo, el estado ha cambiado.');
        else toast(d.mensaje || 'Respuesta inesperada (' + d.__estado + '). Recargo el estado para ver qué quedó.');
        return carga(true);
      });
    }).catch(function (e) { toast(e.message); }).then(function () { ocupado = false; });
  }

  /* Nuevo ERP (asistente de 4 pasos, 2-oct-2026, encargos/20261002_erp_asistente_instalacion.md): solo deja una SOLICITUD en
     la base del mando (la valida la edge y otra vez la base). El alta real la lanza el estudio:
     `python erp/nueva_instancia.py --desde-solicitud <n>`; crear el proyecto es gasto y sigue pidiendo tu OK.
     Toda la lógica vive en AXW_ASIS (bloque de arriba, sin DOM); aquí solo se conecta con la pantalla: el estado es SUYO y
     lo de aquí es cola. La lista de tipos, módulos, zonas y reglas es `estado.perfiles` (la edge), nunca texto de esta página. */
  var asis = null, asisPaso = 0, asisSilencio = false;
  function asisPinta() {
    var e = asis.estado(), raiz = $('asis-raiz'), act = document.activeElement, idAct = act && act.id && raiz.contains(act) ? act.id : '';
    raiz.innerHTML = window.AXW_ASIS.vista(e, nombre);
    // «Nuevo ERP» → mapa (13-oct-2026, decisión por defecto del orquestador): guardada la solicitud, un enlace a su mapa de instalación con
    // su tipo marcado. Va aquí, fuera de AXW_ASIS: el asistente y su alta no cambian. Sin tipo en el mapa (perfil retirado) solo se abre el mapa.
    var hecho = e.hecho && $('asis-aviso');
    if (hecho) {
      var p = document.createElement('p'), a = document.createElement('a');
      a.href = '/panel/#mapa'; a.setAttribute('data-mapa-tipo', e.v.tipo || ''); a.className = 'font-label-md text-label-md underline';
      a.textContent = 'Ver qué tendrá que configurar este negocio (mapa de la instalación) →';
      p.appendChild(a); hecho.appendChild(p);
    }
    var cambioPaso = asisPaso !== e.paso;
    asisPaso = e.paso;
    if (cambioPaso || e.hecho) { var t = $('asis-titulo'); if (t) t.focus(); }
    else if (idAct && $(idAct)) $(idAct).focus();   // el repintado no le quita el foco a quien está tocando un radio o una casilla
  }
  function asisFirma(e) {
    return JSON.stringify([e.paso, e.errores, e.servidor, e.enviando, e.hecho, e.v.tipo, e.v.aj.impuestos_aplica, Object.keys(e.v.opc).length, e.sinCatalogo]);
  }
  function asisEfecto(antes, ahora) {
    if (asisSilencio) return;   // escribir en un campo de texto no repinta (perdería el cursor); el oyente de entrada limpia lo suyo
    if (antes.cat !== ahora.cat || asisFirma(antes) !== asisFirma(ahora)) {
      asisPinta();
      // un error nuevo, un aviso del servidor o el «guardada» llevan el foco a lo que hay que mirar
      var nuevoAviso = JSON.stringify([antes.errores, antes.servidor]) !== JSON.stringify([ahora.errores, ahora.servidor]);
      if ((nuevoAviso && (Object.keys(ahora.errores).length || ahora.servidor)) || (ahora.hecho && !antes.hecho)) {
        var malo = $('asis-raiz').querySelector('[aria-invalid="true"]') || $('asis-aviso');
        if (malo) malo.focus();
      }
    }
    if (!antes.hecho && ahora.hecho) {
      toast('Solicitud #' + ahora.hecho.solicitud + ' guardada. Queda como solicitud: el estudio la lanza con --desde-solicitud ' + ahora.hecho.solicitud + ' y crear el proyecto te pedirá el OK.');
    }
  }
  function asisAbre() {
    var ref = instancias.map(function (i) { return i.nombre; });
    if (asis) asis.despacha({ t: 'catalogo', cat: perfiles, existentes: ref });
    else asis = window.AXW_ASIS.crea(perfiles, ref, pide, asisEfecto);
    if (asis.estado().hecho) asis.despacha({ t: 'reinicia' });
    asisPaso = 0;
    asisPinta();
    var d = $('asis');
    if (!d.open) d.showModal();
  }
  function asisAccion(t) {
    var a = t.getAttribute('data-accion');
    if (a === 'abre-asistente') return asisAbre();
    if (a === 'cierra') { $('asis').close(); return; }   // el borrador se queda en memoria; el POST en vuelo, si lo hay, sigue y avisa por toast
    if (!asis) return;
    if (a === 'ir') asis.despacha({ t: 'ir', paso: t.getAttribute('data-paso') });
    else asis.despacha({ t: a });
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest && ev.target.closest('[data-accion],[data-mod],[data-inst],#reintenta,[data-mapa-tipo],[data-prop],[data-buzon],[data-techo]');
    if (!t) return;
    if (t.hasAttribute('data-mapa-tipo')) {   // del asistente al mapa con su tipo marcado (vistaActual cierra el asistente)
      ev.preventDefault();
      destaca = t.getAttribute('data-mapa-tipo') || null;
      if (location.hash === '#mapa') vistaActual(); else location.hash = '#mapa';
      return;
    }
    if (t.hasAttribute('data-prop')) { ev.preventDefault(); if (!t.disabled) propietario(t.getAttribute('data-prop')); return; }
    if (t.hasAttribute('data-buzon')) { ev.preventDefault(); if (!t.disabled) buzon(t.getAttribute('data-buzon')); return; }
    if (t.hasAttribute('data-techo')) { ev.preventDefault(); if (!t.disabled) techo(); return; }
    if (t.hasAttribute('data-accion')) { ev.preventDefault(); if (!t.disabled) asisAccion(t); }
    else if (t.id === 'reintenta') carga(true).catch(function (e) { toast(e.message); });
    else if (t.hasAttribute('data-inst')) elige(t.getAttribute('data-inst'));
    else if (!t.disabled) alterna(t.getAttribute('data-mod'));
  });
  $('sel-instancia').addEventListener('change', function () { elige(this.value); });
  $('asis-form').addEventListener('submit', function (ev) { ev.preventDefault(); });   // Enter dispara el clic del botón de enviar (data-accion), no el submit
  // un solo oyente de entrada para todo el asistente: texto, selects, radios y casillas; el campo lo dice data-campo / data-opc.
  // También quita la marca de error de un campo del Techo del AaaS en cuanto se vuelve a escribir en él.
  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.closest && ev.target.closest('#ficha .ax-techo')) { ev.target.removeAttribute('aria-invalid'); return; }
    var c = ev.target.closest && ev.target.closest('#asis [data-campo],#asis [data-opc]');
    if (!c || !asis) return;
    if (c.hasAttribute('data-opc')) asis.despacha({ t: 'opc', modulo: c.getAttribute('data-opc'), on: c.checked });
    else if (c.getAttribute('data-campo') === 'tipo') asis.despacha({ t: 'tipo', tipo: c.value });
    else {
      asisSilencio = c.type !== 'radio';   // un radio (¿saca impuestos?) cambia lo que se ve: repinta; el texto y las listas no
      asis.despacha({ t: 'campo', campo: c.getAttribute('data-campo'), valor: c.value });
      asisSilencio = false;
      if (c.type !== 'radio') {   // al escribir se quita el aviso de ese campo y el del servidor sin repintar
        var m = $(window.AXW_ASIS.errId(c.getAttribute('data-campo'))), av = $('asis-aviso');
        if (m) m.classList.add('hidden');
        c.removeAttribute('aria-invalid');
        if (av && !asis.estado().servidor) av.remove();
      }
    }
  });

  window.LW_AUTH.then(function (a) {
    sb = a.sb;
    $('operador').textContent = (a.session && a.session.user && a.session.user.email) || '—';
    return carga(false);
  }).catch(function (e) {
    $('estado-carga').textContent = e.message || 'No se pudo cargar el panel.';
  });
})();
</script>
