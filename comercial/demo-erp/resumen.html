<!-- Resumen (/finanzas/) del ERP MAESTRO (E4.3, sesión bbm-resumen, 15-oct-2026; plan único, encargo bbm-resumen; revisión previa #369 con Producto y Experiencia).
     Sustituye en TODA instancia del maestro al panel inmobiliario de Lawang (panel-finanzas.js), que calculaba en el navegador sobre contratos y unidades.
     Lawang (independiente del maestro) sigue con el suyo. Registro: erp/modulos.py SUSTITUIDA_MAESTRO.
     NO es una página entera: build.py (resumen_pantalla) la inyecta en la cáscara de /asistente/ de Lawang, como taller.html, con la misma puerta que tenía la
     página (data-rol="admin"); la base la vuelve a exigir (finanzas_resumen_datos: sesión + es_admin()).
     Qué hace: UNA lectura (finanzas_resumen_datos) que devuelve un bloque por módulo ENCENDIDO en la base. La pantalla no suma ni deduce nada de dinero: pinta lo que
     llega, una tarjeta por bloque, en el orden de las preguntas del dueño (¿cuánto ha entrado?, ¿cuánto me deben?, ¿cuánto debo?). Un bloque sin permiso lo dice; un
     módulo apagado no tiene tarjeta y el pie dice qué se ha sumado; cargando o sin poder leer, las cifras dicen «—», nunca 0. No escribe nada. Todo texto de la base
     va por textContent. Se engancha por data-accion / data-rs, nunca por un rótulo. Idioma: diccionarios EN_RS e ID_RS (se fusionan en window.LW_EN / LW_ID). -->

           venc ? C.chip(T('Vencido: %x').replace('%x', dinero(venc)), 'mal') : null, otras(gas)],
          ['Ver gastos', '/intranet/v4/gastos/'], venc ? 'mal' : (ng ? 'espera' : null)));
        out.push(tarjeta('salido', 'Ha salido', dinero(gas.pagado),
          [plural(npg, '1 pago', '%n pagos'), T('Gastos del periodo: %x').replace('%x', dinero(gas.gastado))], ['Ver gastos', '/intranet/v4/gastos/']));
      }
    }
    if (caja) {
      var r = num(caja.resultado);
      out.push(tarjeta('queda', 'Te queda', dinero(r), [T('Lo que ha entrado menos lo que ha salido en el periodo.')], null, r != null && r < 0 ? 'mal' : null));
    }
    if (ban) {
      if (ban.sin_permiso) out.push(sinPermiso('bancos', 'Bancos', 'Bancos'));
      else {
        var nc = num(ban.cuentas) || 0;
        out.push(tarjeta('bancos', 'Bancos', ban.saldo == null ? '—' : dinero(ban.saldo),
          [nc ? T(nc === 1 ? 'Saldo de 1 cuenta · entradas %e · salidas %s (año %a)' : 'Saldo de %n cuentas · entradas %e · salidas %s (año %a)')
                  .replace('%n', String(nc)).replace('%e', dinero(ban.entradas)).replace('%s', dinero(ban.salidas)).replace('%a', String(ban.anio || ''))
              : T('Sin saldo leído todavía'), otras(ban)],
          ['Ver bancos', '/intranet/v4/bancos/']));
      }
    }
    vacia(cifras);
    out.forEach(function (t) { cifras.appendChild(t); });
  }

  // Primer día: ningún bloque legible tiene NADA (hay_alguno = false en todos). Un solo aviso con salida, no cinco tarjetas a cero (Experiencia #369).
  function primerDia(d) {
    var B = d.bloques || {}, claves = (d.sumados || []).filter(function (k) { var b = de(B, k); return b && !b.sin_permiso; });
    return claves.length > 0 && claves.every(function (k) { return de(B, k).hay_alguno === false; });
  }
  function pintaPrimerDia(d) {
    var el = $v('primer-dia'), s = d.sumados || [];
    vacia(el);
    el.appendChild(h('p', { text: T('Todavía no hay movimientos. Las cifras se llenan solas con la primera reserva, factura o gasto.') }));
    var acc = h('div', { class: 'axw-acciones' });
    if (s.indexOf('gastos') >= 0) acc.appendChild(h('a', { class: 'axw-boton', href: '/intranet/v4/gastos/', 'data-accion': 'rs-ir', text: T('Registrar un gasto') }));
    if (s.indexOf('facturas') >= 0) acc.appendChild(h('a', { class: 'axw-boton', 'data-primario': '1', href: '/intranet/v4/ventas/', 'data-accion': 'rs-ir', text: T('Nueva venta') }));
    if (acc.firstChild) el.appendChild(acc);
    oculta(el, false);
  }

  function pintaMeses(d) {
    var serie = (d.bloques || {}).serie, sec = $v('meses'), tb = $v('tabla-meses');
    if (!Array.isArray(serie) || !serie.length) { oculta(sec, true); return; }
    var conC = serie.some(function (x) { return x.cobrado != null; }), conP = serie.some(function (x) { return x.pagado != null; });
    var cab = [['Mes']];
    if (conC) cab.push(['Ha entrado', 'rs-d']);
    if (conP) cab.push(['Ha salido', 'rs-d']);
    var filas = serie.slice().reverse().map(function (x, i) {
      var tr = h('tr', i === 0 ? { 'data-hoy': '1' } : null, [C.celda(nombreMes(x.mes))]);
      if (conC) tr.appendChild(C.celda(dinero(x.cobrado), 'rs-d'));
      if (conP) tr.appendChild(C.celda(dinero(x.pagado), 'rs-d'));
      return tr;
    });
    C.tabla(tb, cab, filas);
    oculta(sec, false);
  }

  var NOMBRE = { facturas: 'facturas', recibos: 'cobros', gastos: 'gastos', 'reservas-producto': 'reservas', bancos: 'bancos' };
  function pintaPie(d) {
    var s = (d.sumados || []).map(function (k) { return T(de(NOMBRE, k) || k); });
    if (!s.length) { $v('pie').textContent = T('Nada que sumar: ninguna de estas secciones está encendida (facturas, cobros, gastos, reservas, bancos).'); return; }
    var lista = s.length === 1 ? s[0] : s.slice(0, -1).join(', ') + T(' y ') + s[s.length - 1];
    $v('pie').textContent = T('Suma: %l.').replace('%l', lista);
  }

  // Cargando o «no se ha podido mirar»: nada de tarjetas a cero
  function sinDato() { vacia($v('cifras')); oculta($v('meses'), true); oculta($v('primer-dia'), true); $v('pie').textContent = ''; }
  function error(r) {
    var el = $v('error');
    vacia(el);
    if (!r) { oculta(el, true); return; }
    var c = r.error ? C.clasifica(r.error) : null;
    var texto = c && c.tipo === 'sin_permiso' ? T('Solo la administración ve el Resumen.')
      : (c && (c.tipo === 'sin_sesion' || c.tipo === 'no_disponible') ? C.mensaje(r.error, true) : T('No se han podido cargar las cifras. No es que estén a cero.'));
    el.appendChild(h('span', { text: texto }));
    if (!c || (c.tipo !== 'sin_permiso' && c.tipo !== 'sin_sesion')) el.appendChild(C.boton(T('Reintentar'), 'rs-reintentar'));
    var cod = r.error && (r.error.code || r.error.hint) ? String(r.error.code || '') + (r.error.hint ? ' · ' + r.error.hint : '') : '';
    if (cod) el.appendChild(h('small', { text: cod }));
    oculta(el, false);
  }

  var PETICION = 0;
  function carga() {
    var yo = ++PETICION, rg = rango(E.periodo);
    error(null); sinDato();
    $v('cifras').appendChild(h('p', { class: 'axw-vacio', role: 'status', text: T('Cargando…') }));
    return llama('finanzas_resumen_datos', rg ? { p_desde: rg.desde, p_hasta: rg.hasta } : {}).then(function (r) {
      if (yo !== PETICION) return;   // llegó tarde: ya se pidió otro periodo y ese manda
      var d = r.data;
      if (r.error || !d || typeof d !== 'object' || !DIA_RE.test(String(d.hoy || '')) || !Array.isArray(d.sumados) || !d.bloques || typeof d.bloques !== 'object') {
        sinDato(); error(r.error ? r : { error: null }); return;
      }
      E.hoy = String(d.hoy); E.moneda = String(d.moneda || '');
      $v('rango').textContent = T('Del %d al %h').replace('%d', C.fechaDia(d.desde)).replace('%h', C.fechaDia(d.hasta));
      vacia($v('cifras'));
      if (primerDia(d)) pintaPrimerDia(d);
      else { pintaTarjetas(d); pintaMeses(d); }
      pintaPie(d);
    });
  }
  function alClic(ev) {
    var el = ev.target.closest ? ev.target.closest('[data-accion]') : null;
    if (!el || !raiz.contains(el)) return;
    var a = el.getAttribute('data-accion');
    if (a === 'rs-periodo') {
      var p = el.getAttribute('data-periodo');
      if (['mes', 'anterior', 'anio'].indexOf(p) < 0 || (p !== 'mes' && !E.hoy)) return;
      E.periodo = p;
      $v('periodo').querySelectorAll('[data-accion="rs-periodo"]').forEach(function (b) { b.setAttribute('aria-pressed', b === el ? 'true' : 'false'); });
      carga();
    } else if (a === 'rs-reintentar') carga();
  }
  function arranca() {
    if (!window.LW_AUTH || typeof window.LW_AUTH.then !== 'function') { error({ error: { code: '42501', hint: 'sin_sesion', message: 'Sin sesión' } }); return; }
    window.LW_AUTH.then(function () { raiz.addEventListener('click', alClic); carga(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();
</script>
