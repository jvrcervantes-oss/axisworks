<!-- Pantalla /taller/ del ERP MAESTRO: TALLER POR PASOS (F8 8.T1, 12-oct-2026; encargos/20261008_erp_f8_bbm_inventario_reservas_plan.md §10.1, §10.3, §10.5, §10.8 y §10.9,
     que manda). Sustituye a la orden ligera de la pieza 2 (8-oct): la base es la migración 20261011170000_f8_taller_pasos (funciones taller_*), y la edge taller-fotos.
     NO es una página entera: build.py (taller_pantalla) la inyecta en la cáscara de /asistente/ de Lawang; las ayudas comunes (AXW_COMUN_CSS/JS) y las fotos guiadas
     (AXW_FOTOS_JS) las pega el build desde _compartido/.
     Qué hace:
       · Inicio (paso 0): motos en taller sin orden, buscar matrícula (sin espacios encuentra con espacios), órdenes a medias y, para la administración, «Listas para
         volver» (taller_moto_devuelve). Si la base dice que el taller no está configurado (setup.listo = false) no deja empezar y dice qué falta.
       · Asistente del mecánico, un paso por pantalla: moto → motivo (abre o retoma la orden) → km y gasolina → fotos guiadas → revisiones (Baik / Perlu dicek / Rusak,
         cada una se guarda al pulsar) → resultado (Siap disewa / Tunggu suku cadang / Tidak bisa jalan). El paso 6 (recambios) es de 8.T2.
       · «Listas por modelo» (administración con Flota): revisiones y piezas por modelo, lista común, lista básica y copiar de otro modelo.
     Reglas: el navegador solo PIDE (moto, motivo, km, foto, respuesta, resultado); número, autor, rutas, nombres congelados y el estado de la moto los pone la base.
     Cada paso se guarda al pulsar y si falla se queda en pantalla con «No guardado · Reintentar», sin avanzar. «No hay nada» ≠ «no he podido mirar».
     Todo dato de fuera con textContent. Enganche por data-accion / data-paso / data-tl, nunca por un rótulo. Colores solo por var(--tema-*).
     URL: #o=<orden>&p=<paso> (pushState/popstate; al recargar manda el paso de la BASE), #m=<moto>&p=moto|motivo antes de abrir y #listas para la pestaña de listas.
     Idioma: claves en español; EN_TL e ID_TL se fusionan en window.LW_EN / window.LW_ID (este solo existe en las instancias con indonesio: bbm). -->

  }

  /* Lee la orden y va al paso que dice LA BASE (al recargar, al retomar, al abrir). */

  }

  /* paso 3: km y gasolina */

  }

  /* paso 4: fotos guiadas (pieza común; habla con la edge taller-fotos, no con la base) */
  function token() { return SB.auth.getSession().then(function (s) { return s && s.data && s.data.session ? s.data.session.access_token : ''; }); }

    });

  /* paso 5: revisiones (cada respuesta se guarda al pulsar; upsert por orden y revisión) */
  function pasoRevisiones(c) {

  function repintaRev(id) {

  /* paso 7: resultado */
  function textoFalta(f) {
    var p = String(f).split(':'), k = p[0], v = p.slice(1).join(':');

  }
  function refrescaResultado() {
    var caja = $v('faltan'), lista = E.resultado === 'lista' && E.orden.faltan.length > 0;

    siguiente('Guardar', !E.resultado || (lista && !E.admin));
  }
  function guardaResultado() {
    if (!E.resultado) { estadoPaso('error', T('Elige el resultado.')); return; }
    var nota = ($v('nota-res').value || '').replace(/^\s+|\s+$/g, '');
    var exc = E.resultado === 'lista' && E.orden.faltan.length && $v('excepcion') ? ($v('excepcion').value || '').replace(/^\s+|\s+$/g, '') : '';

    if (E.resultado === 'lista' && E.orden.faltan.length) {

    }
    var id = E.orden.orden.id, moto = E.orden.moto.id, res = E.resultado;
    return envia('taller_orden_resultado', { p_orden: id, p_resultado: res, p_nota: nota || null, p_motivo_excepcion: exc || null }).then(function (r) {
      if (!r) return;
      if (r.error) {
        var c = C.clasifica(r.error);
        /* Duda: una respuesta perdida ANTES pudo cerrar la orden. Un reintento que contesta «ya cerrada» (o «no existe», a un mecánico que no la abrió) no es un
           error: se vuelve a mirar si la moto conserva esta orden viva; si no, se cerró. Solo un error CON código de la base que no sea ese es «no se guardó». */
        if (E.duda === id && (c.hint === 'ya_cerrada' || c.hint === 'orden_no_existe')) {

          return llama('taller_orden_datos', { p_orden: id }).then(function (x) {
            var o2 = x.data && x.data.orden;
            if ((o2 && o2.estado === 'cerrada') || (x.error && C.clasifica(x.error).hint === 'orden_no_existe')) {

      E.duda = null; E.fin = x; E.sucio = true;
      if (x.estado === 'cerrada') E.orden.orden.estado = 'cerrada';

  }
  function pasoFin(c) {
    var x = E.fin || {};
    var t;
    if (x.perdida) t = T('La orden ya estaba cerrada (la respuesta se había perdido). Mira la moto en la lista.');
    else if (x.estado === 'espera_recambio') t = T('La orden queda esperando el recambio; la moto sigue en el taller.');
    else if (x.para_volver) t = T('La moto se queda en el taller hasta que la administración la devuelva (estaba en el taller sin orden).');

    c.appendChild(h('p', { class: 'axw-ok', 'data-tl': 'fin-texto', text: t }));

  }

  /* ── Listas por modelo (administración con Flota) ── */

  function opcionesModelos(sel, d, conComun, actual) {
    if (conComun) sel.appendChild(h('option', { value: '', text: T('Lista común (todos los modelos)') }));
    d.modelos.forEach(function (m) { var o = h('option', { value: String(m.id), text: String(m.nombre || '—') + ' (' + Number(m.revisiones || 0) + ' / ' + Number(m.recambios || 0) + ')' }); if (String(m.id) === actual) o.selected = true; sel.appendChild(o); });
    return sel;
  }
  function campoL(etq, ctrl) { return h('div', { class: 'tl-campo' }, [h('label', { text: T(etq) }), ctrl]); }
  function pintaListas(v, d) {
    var sel = opcionesModelos(h('select', { 'data-tl': 'l-modelo' }), d, true, E.listaSel);
    v.appendChild(h('section', { class: 'tl-tarjeta' }, [campoL('Elige la lista', sel), h('div', { 'data-tl': 'l-estado', class: 'tl-estado', role: 'status' })]));
    if (d.recortado === true) v.appendChild(h('p', { class: 'axw-aviso', text: T('Solo se ven los primeros 500 modelos o piezas.') }));
    // revisiones
    var filas = d.revisiones.map(function (r) {
      var tr = h('tr', { 'data-l-rev': String(r.id) });
      [h('td', { text: String(r.clave) }),
       h('td', null, [h('input', { type: 'text', maxlength: '80', 'data-f': 'nombre_id', value: String(r.nombre_id || ''), 'aria-label': T('Nombre (indonesio)') })]),
       h('td', null, [h('input', { type: 'text', maxlength: '80', 'data-f': 'nombre_en', value: String(r.nombre_en || ''), 'aria-label': T('Nombre (inglés)') })]),
       h('td', null, [h('input', { type: 'text', inputmode: 'numeric', maxlength: '4', 'data-f': 'orden', value: String(r.orden), 'aria-label': T('Posición') })]),
       h('td', null, [h('input', { type: 'checkbox', 'data-f': 'activa', checked: r.activa === true, 'aria-label': T('Activa') })]),
       h('td', null, [h('button', { class: 'axw-boton', type: 'button', 'data-accion': 'tl-l-rev-guarda', 'data-rev-id': String(r.id), text: T('Guardar') })])].forEach(function (td) { tr.appendChild(td); });
      return tr;
    });
    var tabla = h('table', { class: 'axw-tabla tl-tabla-l', 'data-tl': 'l-revisiones' });
    var hijosRev = [];
    if (filas.length) { C.tabla(tabla, [['Clave'], ['Nombre (indonesio)'], ['Nombre (inglés)'], ['Posición'], ['Activa'], ['']], filas); hijosRev.push(h('div', { class: 'axw-tabla-caja' }, [tabla])); }
    else hijosRev.push(h('p', { class: 'axw-vacio', text: T('Esta lista no tiene revisiones.') }));
    if (!filas.length && !E.listaSel) hijosRev.push(h('button', { class: 'axw-boton', type: 'button', 'data-accion': 'tl-l-basica', 'data-primario': '1', text: T('Cargar la lista básica') }));
    var nueva = h('div', { class: 'axw-barra', 'data-tl': 'l-nueva' }, [
      campoL('Clave', h('input', { type: 'text', maxlength: '40', 'data-f': 'clave', autocomplete: 'off' })),
      campoL('Nombre (indonesio)', h('input', { type: 'text', maxlength: '80', 'data-f': 'nombre_id', autocomplete: 'off' })),
      campoL('Nombre (inglés)', h('input', { type: 'text', maxlength: '80', 'data-f': 'nombre_en', autocomplete: 'off' })),
      campoL('Posición', h('input', { type: 'text', inputmode: 'numeric', maxlength: '4', 'data-f': 'orden', autocomplete: 'off' })),
      h('button', { class: 'axw-boton', type: 'button', 'data-accion': 'tl-l-rev-nueva', 'data-primario': '1', text: T('Añadir revisión') })]);
    hijosRev.push(nueva);
    v.appendChild(seccion('Revisiones', hijosRev));
    // copiar de otro modelo
    if (E.listaSel) {
      var desde = h('select', { 'data-tl': 'l-desde' });
      d.modelos.filter(function (m) { return String(m.id) !== E.listaSel; }).forEach(function (m) { desde.appendChild(h('option', { value: String(m.id), text: String(m.nombre || '—') })); });
      v.appendChild(seccion('Copiar de otro modelo', [desde, h('button', { class: 'axw-boton', type: 'button', 'data-accion': 'tl-l-copia', text: T('Copiar') })]));
    }
    // piezas
    var revOpts = function () { var s = h('select', { 'data-f': 'revision' }, [h('option', { value: '', text: T('Ninguna') })]); d.revisiones.forEach(function (r) { s.appendChild(h('option', { value: String(r.id), text: nombreDe(r) })); }); return s; };
    var ul = h('ul', { class: 'tl-lista', 'data-tl': 'l-piezas' });
    d.recambios.forEach(function (p) {
      var rv = d.revisiones.filter(function (r) { return r.id === p.revision_id; })[0];
      ul.appendChild(h('li', { class: 'tl-fila' }, [h('span', { text: [p.ref ? String(p.ref) : null, nombreDe(p), rv ? T('Revisión sugerida') + ': ' + nombreDe(rv) : null].filter(Boolean).join(' · ') }),
        h('button', { class: 'axw-boton', type: 'button', 'data-accion': 'tl-l-quita', 'data-rec-id': String(p.recambio_id), text: T('Quitar') })]));
    });
    var cat = h('select', { 'data-f': 'recambio' }, [h('option', { value: '', text: T('Elige la pieza.') })]);
    d.catalogo.forEach(function (p) { if (!d.recambios.some(function (x) { return x.recambio_id === p.id; })) cat.appendChild(h('option', { value: String(p.id), text: (p.ref ? String(p.ref) + ' · ' : '') + nombreDe(p) })); });
    v.appendChild(seccion('Piezas de esta lista', [d.recambios.length ? ul : h('p', { class: 'axw-vacio', text: T('Esta lista no tiene piezas.') }),
      h('div', { class: 'axw-barra', 'data-tl': 'l-vincula' }, [campoL('Añadir pieza existente', cat), campoL('Revisión sugerida', revOpts()), h('button', { class: 'axw-boton', type: 'button', 'data-accion': 'tl-l-vincula', text: T('Añadir') })]),
      h('div', { class: 'axw-barra', 'data-tl': 'l-pieza-nueva' }, [h('strong', { text: T('Pieza nueva') }),
        campoL('Referencia', h('input', { type: 'text', maxlength: '60', 'data-f': 'ref', autocomplete: 'off' })),
        campoL('Nombre (indonesio)', h('input', { type: 'text', maxlength: '120', 'data-f': 'nombre_id', autocomplete: 'off' })),
        campoL('Nombre (inglés)', h('input', { type: 'text', maxlength: '120', 'data-f': 'nombre_en', autocomplete: 'off' })),
        campoL('Coste de referencia', h('input', { type: 'text', inputmode: 'decimal', maxlength: '16', 'data-f': 'coste', autocomplete: 'off' })),
        campoL('Moneda', h('input', { type: 'text', maxlength: '3', 'data-f': 'moneda', autocomplete: 'off' })),
        campoL('Revisión sugerida', revOpts()),
        h('button', { class: 'axw-boton', type: 'button', 'data-accion': 'tl-l-rec-nueva', 'data-primario': '1', text: T('Añadir') })])]));
  }
  function lEstado(tipo, t) { var e = $v('l-estado'); if (!e) return; vacia(e); if (t) e.appendChild(h('p', { class: tipo === 'ok' ? 'axw-ok' : 'axw-error', text: t })); }
  function fv(caja, f) { var e = caja && caja.querySelector('[data-f="' + f + '"]'); return e ? (e.type === 'checkbox' ? e.checked : String(e.value || '').replace(/^\s+|\s+$/g, '')) : null; }
  /* Las escrituras de las listas: una a la vez; tras cada una se vuelve a leer (lo que se ve es lo que dice la base). Repetir tras perder la respuesta es seguro
     salvo un alta (la base contesta clave_duplicada / ref_duplicada: no hay dos). */
  function lEscribe(bt, nombre, args, okTexto) {
    if (!C.ocupa(bt)) return Promise.resolve();
    return llama(nombre, args).then(function (r) {
      C.libera(bt);
      if (r.error) { lEstado('error', T('No guardado') + ' · ' + texto(r.error)); return null; }
      return abreListas().then(function () { lEstado('ok', okTexto || T('Guardado.')); return r.data; });
    });
  }
  function accionListas(a, el) {
    var prod = E.listaSel || null;
    if (a === 'tl-l-basica') return lEscribe(el, 'taller_lista_basica', {});
    if (a === 'tl-l-rev-guarda') {
      var tr = el.closest('tr'), orden = fv(tr, 'orden');
      if (!/^\d{1,4}$/.test(orden)) { lEstado('error', T('El orden es un número de 0 a 9999.')); return; }
      return lEscribe(el, 'taller_revision_guarda', { p_id: el.getAttribute('data-rev-id'), p_datos: { nombre_id: fv(tr, 'nombre_id'), nombre_en: fv(tr, 'nombre_en'), orden: Number(orden), activa: fv(tr, 'activa') } });
    }
    if (a === 'tl-l-rev-nueva') {
      var c = $v('l-nueva'), ord = fv(c, 'orden'), datos = { producto_id: prod, clave: fv(c, 'clave').toLowerCase(), nombre_id: fv(c, 'nombre_id'), nombre_en: fv(c, 'nombre_en') };
      if (!/^[a-z0-9_]{2,40}$/.test(datos.clave)) { lEstado('error', T('La clave va en minúsculas, cifras o guion bajo (2 a 40).')); return; }
      if (!datos.nombre_id || !datos.nombre_en) { lEstado('error', T('Los nombres van en una línea (hasta 80 caracteres).')); return; }
      if (ord) { if (!/^\d{1,4}$/.test(ord)) { lEstado('error', T('El orden es un número de 0 a 9999.')); return; } datos.orden = Number(ord); }
      return lEscribe(el, 'taller_revision_guarda', { p_id: null, p_datos: datos });
    }
    if (a === 'tl-l-copia') {
      var desde = $v('l-desde') && $v('l-desde').value;
      if (!desde || !prod) return;
      if (!C.ocupa(el)) return;
      return llama('taller_listas_copia', { p_desde: desde, p_a: prod }).then(function (r) {
        C.libera(el);
        if (r.error || !r.data) { lEstado('error', T('No guardado') + ' · ' + texto(r.error || {})); return; }
        var t = TT('Copiadas: {r} revisiones y {v} piezas.', { r: Number(r.data.revisiones) || 0, v: Number(r.data.vinculos) || 0 });
        return abreListas().then(function () { lEstado('ok', t); });
      });
    }
    if (a === 'tl-l-quita') return lEscribe(el, 'taller_recambio_vincula', { p_recambio: el.getAttribute('data-rec-id'), p_producto: prod, p_revision: null, p_quita: true });
    if (a === 'tl-l-vincula') {
      var cv = $v('l-vincula'), rec = fv(cv, 'recambio');
      if (!rec) { lEstado('error', T('Elige la pieza.')); return; }
      return lEscribe(el, 'taller_recambio_vincula', { p_recambio: rec, p_producto: prod, p_revision: fv(cv, 'revision') || null, p_quita: false });
    }
    if (a === 'tl-l-rec-nueva') {
      var cn = $v('l-pieza-nueva'), coste = fv(cn, 'coste'), mon = (fv(cn, 'moneda') || '').toUpperCase(), imp = C.importe(coste, 4);
      if (imp.e || (!imp.vacio) !== !!mon || (mon && !/^[A-Z]{3}$/.test(mon))) { lEstado('error', T('El coste va con su moneda (las dos o ninguna, moneda en tres letras).')); return; }
      var dp = { ref: fv(cn, 'ref') || null, nombre_id: fv(cn, 'nombre_id'), nombre_en: fv(cn, 'nombre_en'), coste_ref: imp.vacio ? null : imp.v, moneda: mon || null };
      if (!dp.nombre_id || !dp.nombre_en) { lEstado('error', T('Los nombres van en una línea (hasta 80 caracteres).')); return; }
      var revSug = fv(cn, 'revision') || null;
      if (!C.ocupa(el)) return;
      // alta y vínculo son dos llamadas: si la segunda falla, la pieza queda en el catálogo y se vincula con «Añadir pieza existente» (se dice)
      return llama('taller_recambio_guarda', { p_id: null, p_datos: dp }).then(function (r) {
        if (r.error || !UUID.test(String(r.data || ''))) { C.libera(el); lEstado('error', T('No guardado') + ' · ' + texto(r.error || {})); return; }
        return llama('taller_recambio_vincula', { p_recambio: r.data, p_producto: prod, p_revision: revSug, p_quita: false }).then(function (r2) {
          C.libera(el);
          return abreListas().then(function () { if (r2.error) lEstado('error', T('No guardado') + ' · ' + texto(r2.error)); else lEstado('ok', T('Guardado.')); });
        });
      });
    }
  }

  /* ── eventos ── */
  function alClic(ev) {
    var el = ev.target.closest ? ev.target.closest('[data-accion]') : null;
    if (!el || !raiz.contains(el) || el.disabled) return;
    var a = el.getAttribute('data-accion');
    if (a.indexOf('fg-') === 0 || a.indexOf('tl-km-') === 0) return;   // las fotos y los diálogos llevan su propio manejador
    if (a === 'tl-tab-taller') { error(''); exito(''); if (!E.enviando) ir('inicio', true); return; }
    if (a === 'tl-tab-listas') { error(''); exito(''); if (!E.enviando && E.flota) ir('listas', true); return; }
    if (a.indexOf('tl-l-') === 0) { accionListas(a, el); return; }
    if (a === 'tl-moto') {
      var m = E.datos && E.datos.motos.filter(function (x) { return x.id === el.getAttribute('data-moto-id'); })[0];
      if (m) { error(''); exito(''); E.moto = m; E.orden = null; E.motivo = null; E.gas = null; E.resultado = null; ir('moto', true); }
      return;
    }
    if (a === 'tl-continuar') { error(''); exito(''); E.gas = null; E.resultado = null; continuar(el.getAttribute('data-orden-id')); return; }
    if (a === 'tl-devolver') { devolver(el); return; }
    if (a === 'tl-atras') { atras(); return; }
    if (a === 'tl-reintentar') { if (E.reintento && !E.enviando) E.reintento(); return; }
    if (a === 'tl-elige') {
      var g = el.getAttribute('data-grupo'), v = el.getAttribute('data-valor');
      if (g === 'motivo') E.motivo = v; else if (g === 'gas') E.gas = Number(v); else if (g === 'resultado') E.resultado = v;
      Array.prototype.forEach.call(el.parentNode.querySelectorAll('[role="radio"]'), function (b) { b.setAttribute('aria-checked', String(b === el)); });
      if (g === 'resultado') refrescaResultado();
      return;
    }
    if (a === 'tl-rev') { marca(el.getAttribute('data-rev-id'), el.getAttribute('data-res')); return; }
    if (a === 'tl-rev-reintentar') { var er = E.revError[el.getAttribute('data-rev-id')]; if (er) marca(el.getAttribute('data-rev-id'), er.res, er.nota); return; }
    if (a === 'tl-rev-nota') {
      var id = el.getAttribute('data-rev-id'), r = revDe(id), inp = raiz.querySelector('[data-rev-nota="' + id + '"]');
      if (r && r.resultado && inp) marca(id, r.resultado, (inp.value || '').replace(/^\s+|\s+$/g, ''));
      return;
    }
    if (a === 'tl-siguiente') {
      if (E.enviando) return;
      error(''); exito('');
      if (E.paso === 'moto') {
        var vv = vivaDe(E.moto);
        if (E.orden && E.orden.moto && E.orden.moto.id === E.moto.id && E.orden.orden.estado !== 'cerrada') return entraOrden(E.orden.orden.id, true);
        if (vv && vv.paso) return continuar(vv.id);
        return ir('motivo', true);
      }
      if (E.paso === 'motivo') return abre();
      if (E.paso === 'km') return guardaKm(false);
      if (E.paso === 'fotos') {
        // salir del paso cierra la pieza de fotos y con ella sus reintentos: no se sale con fotos a medio subir
        if (E.fg && E.fg.sinSubir() > 0) { estadoPaso('aviso', T('Quedan fotos sin subir: espera a que suban o pulsa Reintentar.')); return; }
        return pasoGuarda('revisiones');
      }
      if (E.paso === 'revisiones') {
        if (Object.keys(E.revGuardando).length) { estadoPaso('aviso', T('Espera a que se guarden las revisiones.')); return; }
        return pasoGuarda('resultado');
      }
      if (E.paso === 'resultado') return guardaResultado();
      if (E.paso === 'fin') { E.fin = null; E.orden = null; E.sucio = true; ir('inicio', false); return; }   // ir() relee la lista (una vez)
    }
  }
  /* Abrir una orden = sustituir la entrada «motivo» por «km» (replace, no push): el motivo queda congelado y Atrás desde km vuelve a la moto. */
  function alVolver() {
    if (E.enviando) { ponHash(E.paso, true); exito(''); error(T('Espera a que termine de guardar.')); return; }   // nada navegable mientras dura un envío
    rutea(false);
  }
  /* Lo que manda la URL. Con #o= la orden se LEE de la base y se va a SU paso (recarga, otro móvil); con Atrás dentro de la misma orden se va al paso de la URL. */
  function rutea(inicial) {
    var hsh = leeHash();
    if (E.paso === 'fin') { E.fin = null; ir('inicio', false); return; }   // terminada la orden, Atrás no vuelve a sus pasos
    if (hsh.listas) { if (E.flota) ir('listas', false); else ir('inicio', false); return; }
    if (hsh.o) {
      // Atrás dentro de la misma orden: al paso de la URL, con la orden RELEÍDA (las fotos y respuestas que se hicieron después tienen que verse)
      if (!inicial && E.orden && E.orden.orden.id === hsh.o && PASOS.indexOf(hsh.p) > 1) return cargaOrden(hsh.o).then(function (ok) { if (ok) ir(hsh.p, false); });
      return entraOrden(hsh.o, false);
    }
    if (hsh.m && E.datos) {
      var m = E.datos.motos.filter(function (x) { return x.id === hsh.m; })[0];
      if (m) {
        E.moto = m;
        if (hsh.p === 'motivo' && !(E.orden && E.orden.moto && E.orden.moto.id === m.id)) { ir('motivo', false); return; }
        ir('moto', false); return;
      }
    }
    ir('inicio', false);
  }
  function admin(f) {
    var rol = f ? (window.LW_ROL && typeof window.LW_ROL.efectivo === 'function' ? window.LW_ROL.efectivo(f) : f.rol) : null;
    return rol === 'admin' || rol === 'super_admin' ? rol : null;
  }
  function init(aut) {
    SB = aut.sb; E.ficha = aut.ficha || {};
    var rol = admin(E.ficha);
    E.admin = !!rol;
    // solo decide qué se OFRECE: la base vuelve a exigir el permiso en cada llamada
    E.flota = rol === 'super_admin' || (!!rol && Array.isArray(E.ficha.herramientas) && E.ficha.herramientas.indexOf('flota') !== -1);
    oculta(raiz.querySelector('[data-accion="tl-tab-listas"]'), !E.flota);
    raiz.addEventListener('click', alClic);
    raiz.addEventListener('input', function (ev) { if (ev.target === $v('buscar')) pintaBusqueda(); });
    raiz.addEventListener('change', function (ev) { if (ev.target === $v('l-modelo')) { E.listaSel = ev.target.value; abreListas(); } });
    window.addEventListener('popstate', alVolver);
    cargaDatos().then(function () { rutea(true); });
  }
  function arranca() {
    if (!window.LW_AUTH || typeof window.LW_AUTH.then !== 'function') { error(T('Sin sesión: recarga la página o vuelve a entrar.')); return; }
    window.LW_AUTH.then(init);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();
</script>
