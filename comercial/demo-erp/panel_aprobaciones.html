    var motivo = (($('plazo-motivo') && $('plazo-motivo').value) || '').trim();
    var box = $('resultado');
    function aviso(ok, t) { box.hidden = false; box.textContent = t; box.setAttribute('class', ok ? 'ap-res' : 'ap-res ap-mal'); }
    if (!motivo || motivo.length > 300) return aviso(false, 'Escribe el motivo (obligatorio, hasta 300 caracteres).');
    var cuerpo = { accion: accion === 'plazo-correos' ? 'plazo_correos' : 'plazo_correos_cancela', motivo: motivo };
    if (accion === 'plazo-correos') {
      var dias = Number($('plazo-dias') && $('plazo-dias').value);
      var efectivo = Number($('plazos').getAttribute('data-efectivo'));
      if (!isFinite(dias) || Math.floor(dias) !== dias) return aviso(false, 'Los días tienen que ser un número entero.');
      if (isFinite(efectivo) && dias < efectivo && typeof window.confirm === 'function'
          && !window.confirm('Vas a ACORTAR el plazo de los correos del Padrino a ' + dias + ' días. Esto borra correos de forma irreversible: los más viejos se borrarán en la primera purga posterior a 24 h (entre 24 y 48 h tras aceptar). Puedes cancelarlo antes. ¿Continuar?')) return;
      cuerpo.dias = dias;
    }
    ocupado = true;
    var bs = document.querySelectorAll('[data-accion="plazo-correos"],[data-accion="plazo-correos-cancela"]');
    Array.prototype.forEach.call(bs, function (b) { b.setAttribute('disabled', 'disabled'); });
    pide(cuerpo).then(function (d) { var r = textoPlazo(d.__estado, d, accion); aviso(r[0], r[1]); })
      .catch(function () { aviso(false, 'No se pudo completar. Mira los plazos de arriba antes de repetir.'); })
      .then(function () { ocupado = false; return cargaPlazos(); });
  }
  function carga() {
    cargaPausa();
    cargaPlazos();
    var est = $('estado');
    est.hidden = false; est.setAttribute('class', 'ap-estado'); est.textContent = 'Cargando…'; $('lista').hidden = true;
    return pide({ accion: 'lista' }).then(function (d) {
      if (d.__estado === 403) return pintaError(est, $('lista'), 'Esta cuenta no es la del owner del piloto.');
      if (d.__estado !== 200 || d.ok !== true) return pintaError(est, $('lista'), 'No he podido leer las aprobaciones (' + d.__estado + '). No es que no haya ninguna: no he podido mirar.');
      pintaLista(document, $('lista'), est, d.aprobaciones, Date.now());
    }).catch(function () { pintaError(est, $('lista'), 'No he podido leer las aprobaciones. No es que no haya ninguna: no he podido mirar.'); });
  }
  function resuelve(boton, decision) {
    if (ocupado) return;
    ocupado = true;
    var botones = document.querySelectorAll('[data-accion="aprueba"],[data-accion="rechaza"]');
    Array.prototype.forEach.call(botones, function (b) { b.setAttribute('disabled', 'disabled'); });
    pide({ accion: 'resuelve', numero: boton.getAttribute('data-numero'), hash: boton.getAttribute('data-hash'), decision: decision }).then(function (d) {
      var r = textoResultado(d.__estado, d), box = $('resultado');
      box.hidden = false; box.textContent = r[1]; box.setAttribute('class', r[0] ? 'ap-res' : 'ap-res ap-mal');
    }).catch(function () {
      var box = $('resultado'); box.hidden = false; box.setAttribute('class', 'ap-res ap-mal');
      box.textContent = 'No se pudo completar. No se ha cambiado nada que yo sepa: recarga la lista antes de repetir.';
    }).then(function () { ocupado = false; return carga(); });
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest && ev.target.closest('[data-accion]');
    if (!t || t.hasAttribute('disabled')) return;
    var a = t.getAttribute('data-accion');
    if (a === 'aprueba') resuelve(t, 'aprobada');
    else if (a === 'rechaza') resuelve(t, 'rechazada');
    else if (a === 'para' || a === 'arranca') cambiaPausa(a);
    else if (a === 'plazo-correos' || a === 'plazo-correos-cancela') cambiaPlazo(a);
    else if (a === 'recarga') carga();
  });
  if (typeof window !== 'undefined' && window.LW_AUTH) {
    window.LW_AUTH.then(function (a) { sb = a.sb; return carga(); }).catch(function (e) {
      pintaError($('estado'), $('lista'), (e && e.message) || 'No se pudo cargar.');
    });
  }
})();
</script>
</body>
</html>
