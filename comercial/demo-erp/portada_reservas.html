<!-- Portada (/home/) de una instancia de tipo Reservas del ERP MAESTRO (11-oct-2026; plan único F8). Solo la llevan las instancias con `"portada": "reservas"` en
     erp/instancias.json; el resto (y Lawang) siguen con su Home. Brief literal del owner: «La Home debe ser directa al grano de las reservas de ese día, todo muy claro,
     modelo a entregar, cliente y estado del pago.»
     NO es una página entera: build.py (portada_reservas) la inyecta en la cáscara de /asistente/ de Lawang, como taller.html, y SIN puerta de herramienta: es la página de
     inicio de cualquiera que entra. Quien no tenga permiso de reservas ve que no puede verlas (no «hoy no hay»), y la base vuelve a exigirlo en la lectura.
     Qué hace: lee las entregas y las devoluciones de un día (por defecto, HOY en la zona horaria de la instancia: lo decide la base, no el reloj del navegador) y pinta,
     por reserva, el modelo, la unidad, el cliente y el estado del pago QUE DA LA BASE (`pago_estado`): la pantalla no calcula ni deduce nada de dinero. Tocar una
     reserva abre su ficha con lo que ya llegó. No escribe nada. Todo texto de la base se pinta con textContent. Se engancha por data-accion / data-ph, nunca por un rótulo.
     Idioma: ES/EN con el diccionario EN_PH de abajo más el de las ayudas comunes (se añaden a window.LW_EN solo si la clave no existe). -->
<div class="flex flex-col w-full gap-6" data-ph="raiz">
<style>
/*AXW_COMUN_CSS*/
.ph-dia{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
a.axw-boton{text-decoration:none}
.ph-fecha{font-size:15px;color:rgb(var(--tema-on-surface-variant, 68 72 63))}
.ph-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ph-fila{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:14px 16px;border-radius:12px;border:1px solid rgb(var(--tema-outline-variant, 197 200 188));background:rgb(var(--tema-surface-container-lowest, 255 255 255));color:inherit;font:inherit;cursor:pointer}
.ph-fila:hover,.ph-fila:focus-visible{border-color:rgb(var(--tema-deep-lagoon, 16 76 79))}
.ph-modelo{font-size:17px;font-weight:600;line-height:1.3;word-break:break-word}
.ph-sub{font-size:14px;color:rgb(var(--tema-on-surface-variant, 68 72 63));word-break:break-word}
.ph-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.ph-chips .axw-chip{font-size:13px;padding:3px 12px}
.ph-cuenta{font-size:13px;color:rgb(var(--tema-outline, 117 120 110));font-weight:400}
@media (max-width:640px){.ph-fila{grid-template-columns:1fr}.ph-chips{justify-content:flex-start}}
</style>

<div class="lw-cabecera flex flex-col lg:flex-row lg:items-end justify-between gap-4 bg-surface-container-lowest p-8 rounded-xl shadow-sm">
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg text-headline-lg text-deep-lagoon tracking-tight" data-ph="titulo" data-lwt>Hoy</h1>
<p class="ph-fecha" data-ph="fecha"></p>
</div>
<div class="ph-dia">
<button class="axw-boton" type="button" data-accion="ph-antes"><span data-lwt>‹ Día anterior</span></button>
<button class="axw-boton" type="button" data-accion="ph-hoy"><span data-lwt>Hoy</span></button>
<button class="axw-boton" type="button" data-accion="ph-despues"><span data-lwt>Día siguiente ›</span></button>
<a class="axw-boton axw-oculto" data-primario="1" data-ph="ir-reservas" href="/intranet/v4/reservas-producto/"><span data-lwt>Reservas de producto</span></a>
</div>
</div>

<p class="axw-error axw-oculto" data-ph="error" role="alert"></p>

<section class="bg-surface-container-lowest rounded-xl p-6 shadow-sm flex flex-col gap-3" aria-labelledby="ph-t-entregas">
<h2 id="ph-t-entregas" class="font-headline-sm text-headline-sm text-deep-lagoon"><span data-lwt>Entregas</span> <span class="ph-cuenta" data-ph="n-entregas"></span></h2>
<div data-ph="estado-entregas" class="axw-vacio" role="status"></div>
<ul class="ph-lista" data-ph="entregas"></ul>
</section>

<section class="bg-surface-container-lowest rounded-xl p-6 shadow-sm flex flex-col gap-3" aria-labelledby="ph-t-devoluciones">
<h2 id="ph-t-devoluciones" class="font-headline-sm text-headline-sm text-deep-lagoon"><span data-lwt>Devoluciones</span> <span class="ph-cuenta" data-ph="n-devoluciones"></span></h2>
<div data-ph="estado-devoluciones" class="axw-vacio" role="status"></div>
<ul class="ph-lista" data-ph="devoluciones"></ul>
</section>

</div>
<!--AXW_SCRIPT-->
<script>
(function () {
  'use strict';
  var EN_PH = {
    'Inicio': 'Home', 'Hoy': 'Today', '‹ Día anterior': '‹ Previous day', 'Día siguiente ›': 'Next day ›', 'Reservas de producto': 'Product bookings',
    'Entregas': 'Handovers', 'Devoluciones': 'Returns',
    'Hoy no hay entregas.': 'No handovers today.', 'Hoy no hay devoluciones.': 'No returns today.',
    'Este día no hay entregas.': 'No handovers on this day.', 'Este día no hay devoluciones.': 'No returns on this day.',
    'Pagado': 'Paid', 'Pago registrado, sin confirmar': 'Payment recorded, not confirmed', 'Pendiente de pago': 'Payment pending',
    'Estado del pago desconocido': 'Payment status unknown',
    'Sin confirmar': 'Not confirmed', 'Confirmada': 'Confirmed', 'En curso': 'Ongoing', 'Devuelta': 'Returned',
    'Sin cliente': 'No customer', 'Cliente sin permiso para verlo': 'Customer you cannot see',
    'Reserva': 'Booking', 'Modelo': 'Model', 'Unidad': 'Unit', 'Cliente': 'Customer', 'Fechas': 'Dates', 'Estado': 'Status', 'Pago': 'Payment', 'Precio': 'Price',
    'Dirección de entrega': 'Handover address', 'Dirección de recogida': 'Pick-up address', 'Hora': 'Time',
    'Abrir Reservas de producto': 'Open Product bookings',
    'No se han podido mirar las reservas': 'The bookings could not be checked',
    'No tienes permiso para ver las reservas. No es que no haya: no se ha podido mirar.': 'You do not have permission to see the bookings. It does not mean there are none: they could not be checked.',
    'El módulo de reservas está apagado en esta instancia: no hay reservas que mirar. Esto NO quiere decir que no haya nada.': 'The bookings module is off in this instance: there are no bookings to check. This does NOT mean there is nothing.'
  };
  // Indonesio (owner, 11-oct-2026: bbm en indonesio e inglés). Misma clave en español que EN_PH; se fusiona en window.LW_ID solo donde existe (bbm).
  var ID_PH = {
    'Inicio': 'Beranda', 'Hoy': 'Hari ini', '‹ Día anterior': '‹ Hari sebelumnya', 'Día siguiente ›': 'Hari berikutnya ›', 'Reservas de producto': 'Booking',
    'Entregas': 'Serah terima', 'Devoluciones': 'Motor kembali',
    'Hoy no hay entregas.': 'Hari ini tidak ada serah terima.', 'Hoy no hay devoluciones.': 'Hari ini tidak ada motor yang kembali.',
    'Este día no hay entregas.': 'Tidak ada serah terima pada tanggal ini.', 'Este día no hay devoluciones.': 'Tidak ada motor yang kembali pada tanggal ini.',
    'Pagado': 'Lunas', 'Pago registrado, sin confirmar': 'Pembayaran tercatat, belum dikonfirmasi', 'Pendiente de pago': 'Belum dibayar',
    'Estado del pago desconocido': 'Status pembayaran tidak diketahui',
    'Sin confirmar': 'Belum dikonfirmasi', 'Confirmada': 'Terkonfirmasi', 'En curso': 'Sedang disewa', 'Devuelta': 'Sudah kembali',
    'Sin cliente': 'Tanpa pelanggan', 'Cliente sin permiso para verlo': 'Pelanggan (Anda tidak punya akses)',
    'Reserva': 'Booking', 'Modelo': 'Model', 'Unidad': 'Unit', 'Cliente': 'Pelanggan', 'Fechas': 'Tanggal', 'Estado': 'Status', 'Pago': 'Pembayaran', 'Precio': 'Harga',
    'Dirección de entrega': 'Alamat antar', 'Dirección de recogida': 'Alamat jemput', 'Hora': 'Jam',
    'Abrir Reservas de producto': 'Buka daftar booking',
    'No se han podido mirar las reservas': 'Booking tidak dapat diperiksa',
    'No tienes permiso para ver las reservas. No es que no haya: no se ha podido mirar.': 'Anda tidak punya akses untuk melihat booking. Bukan berarti tidak ada booking: datanya tidak dapat diperiksa.',
    'El módulo de reservas está apagado en esta instancia: no hay reservas que mirar. Esto NO quiere decir que no haya nada.': 'Modul booking tidak aktif di sistem ini: tidak ada booking yang bisa diperiksa. Ini BUKAN berarti tidak ada apa-apa.'
  };
  var T = typeof window.lwT === 'function' ? window.lwT : function (s) { return String(s); };
  var traduce = function (r) { if (typeof window.lwIdiomaAplicar === 'function') { try { window.lwIdiomaAplicar(r); } catch (e) { /* MUDO A PROPOSITO: traducir no tumba la pantalla; queda en español */ } } };
  var raiz = document.querySelector('[data-ph="raiz"]');
  /*AXW_COMUN_JS*/
  var C = axwComun(raiz, T);
  if (window.LW_EN && typeof window.LW_EN === 'object') {
    [EN_PH, C.EN].forEach(function (d) { Object.keys(d).forEach(function (k) { if (!(k in window.LW_EN)) window.LW_EN[k] = d[k]; }); });
  }
  if (window.LW_ID && typeof window.LW_ID === 'object') {
    [ID_PH, C.ID || {}].forEach(function (d) { Object.keys(d).forEach(function (k) { if (!(k in window.LW_ID)) window.LW_ID[k] = d[k]; }); });
  }
  traduce(raiz);
  var $v = function (n) { return raiz.querySelector('[data-ph="' + n + '"]'); };
  var h = C.h, vacia = C.vacia, oculta = C.oculta, chip = C.chip;
  function error(m) { var e = $v('error'); e.textContent = m || ''; oculta(e, !m); }

  // El estado del pago lo decide la base (pago_estado); aquí solo se le pone nombre y tono. Texto Y color: el color solo no se lee.
  var PAGO = { pagado: ['Pagado', 'ok'], registrado: ['Pago registrado, sin confirmar', 'espera'], pendiente: ['Pendiente de pago', 'mal'] };
  var ESTADO = { bloqueo: ['Sin confirmar', 'espera'], confirmada: ['Confirmada', 'neutro'], en_curso: ['En curso', 'neutro'], devuelta: ['Devuelta', 'neutro'] };
  var PROPIOS = {
    modulo_apagado: T('El módulo de reservas está apagado en esta instancia: no hay reservas que mirar. Esto NO quiere decir que no haya nada.'),
    sin_permiso: T('No tienes permiso para ver las reservas. No es que no haya: no se ha podido mirar.'), soloLectura: true
  };

  /* Una entrada por RPC, con el nombre LITERAL (erp/contrato_front.py extrae `lwDatos('x')` y comprueba contra la base que existe). Es una lectura: va por lwDatos. */
  var RPC = {
    portada_reservas_dia_datos: function (a) { return window.lwDatos('portada_reservas_dia_datos', a); }
  };
  function llama(nombre, args) {
    var p;
    try { p = RPC[nombre](args || {}); } catch (e) { return Promise.resolve({ data: null, error: e }); }
    return Promise.resolve(p).then(function (r) { return { data: r ? r.data : null, error: r ? r.error : { message: 'sin respuesta' } }; },
                                   function (e) { return { data: null, error: e }; });
  }

  var E = { dia: null, hoy: null, filas: {}, puedeReservas: false };
  // solo decide si se OFRECE el enlace; quien entra o no a la pantalla lo vuelve a decidir la base
  function tieneReservas(f) { return !!f && (f.rol === 'super_admin' || (Array.isArray(f.herramientas) && f.herramientas.indexOf('reservas-producto') !== -1)); }
  var DIA_RE = /^\d{4}-\d{2}-\d{2}$/;
  function fechaLarga(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return '';
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    try { return d.toLocaleDateString(C.locale(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { /* MUDO A PROPOSITO: sin Intl se enseña la fecha corta */ return C.fechaDia(s); }
  }
  // Mover el día es aritmética de calendario sobre la fecha que dio la base (no se lee el reloj del navegador): mediodía UTC para que ningún cambio de hora salte un día.
  function suma(s, n) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    var d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12));
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function quien(x) {
    if (x.cliente_oculto) return T('Cliente sin permiso para verlo');
    return x.cliente ? String(x.cliente) : T('Sin cliente');
  }
  function chipPago(x) {
    var p = PAGO[x.pago_estado];
    return p ? chip(T(p[0]), p[1]) : chip(T('Estado del pago desconocido'), 'mal');
  }
  function fila(x) {
    var izq = h('div', null, [
      h('div', { class: 'ph-modelo', text: x.producto ? String(x.producto) : '—' }),
      h('div', { class: 'ph-sub', text: [x.unidad ? String(x.unidad) : null, quien(x)].filter(Boolean).join(' · ') })
    ]);
    if (x.hora) izq.appendChild(h('div', { class: 'ph-sub', text: T('Hora') + ': ' + String(x.hora) }));
    var chips = h('div', { class: 'ph-chips' }, [chipPago(x)]);
    var est = ESTADO[x.estado];
    if (est && x.estado !== 'confirmada') chips.appendChild(chip(T(est[0]), est[1]));
    E.filas[String(x.id)] = x;
    return h('li', null, [h('button', { class: 'ph-fila', type: 'button', 'data-accion': 'ph-ver', 'data-reserva-id': String(x.id) }, [izq, chips])]);
  }
  function pinta(clave, lista) {
    var ul = $v(clave), est = $v('estado-' + clave), n = $v('n-' + clave);
    vacia(ul);
    n.textContent = '(' + lista.length + ')';
    if (!lista.length) {
      est.className = 'axw-vacio';
      var esHoy = E.dia === E.hoy;
      est.textContent = clave === 'entregas' ? T(esHoy ? 'Hoy no hay entregas.' : 'Este día no hay entregas.') : T(esHoy ? 'Hoy no hay devoluciones.' : 'Este día no hay devoluciones.');
      return;
    }
    est.textContent = '';
    lista.forEach(function (x) { ul.appendChild(fila(x)); });
  }
  function noSeHaPodido(r) {
    var t = r.error ? C.mensaje(r.error, true, PROPIOS) : T('La base ha devuelto algo inesperado. No es que esté vacía: no se ha podido mirar.');
    ['entregas', 'devoluciones'].forEach(function (k) {
      vacia($v(k)); $v('n-' + k).textContent = '';
      var est = $v('estado-' + k); est.className = 'axw-error'; est.textContent = T('No se han podido mirar las reservas') + ': ' + t;
    });
  }
  var PETICION = 0;
  function carga(dia) {
    var yo = ++PETICION;
    error('');
    ['entregas', 'devoluciones'].forEach(function (k) { var est = $v('estado-' + k); est.className = 'axw-vacio'; est.textContent = T('Cargando…'); });
    return llama('portada_reservas_dia_datos', { p_dia: dia || null }).then(function (r) {
      if (yo !== PETICION) return;   // llegó tarde: ya se pidió otro día y ese manda
      var d = r.data;
      if (r.error || !d || !DIA_RE.test(String(d.dia || '')) || !Array.isArray(d.entregas) || !Array.isArray(d.devoluciones)) { noSeHaPodido(r); return; }
      E.dia = String(d.dia);
      if (!dia) E.hoy = E.dia;   // sin día pedido, la base contesta con HOY en la zona de la instancia
      E.filas = {};
      $v('titulo').textContent = E.dia === E.hoy ? T('Hoy') : C.fechaDia(E.dia);
      $v('fecha').textContent = fechaLarga(E.dia);
      pinta('entregas', d.entregas);
      pinta('devoluciones', d.devoluciones);
    });
  }
  function ver(x) {
    var p = PAGO[x.pago_estado], est = ESTADO[x.estado];
    var pares = [['Reserva', x.numero_reserva], ['Modelo', x.producto], ['Unidad', x.unidad], ['Cliente', quien(x)],
                 ['Fechas', C.fechaDia(x.desde) + ' → ' + C.fechaDia(x.hasta)],
                 ['Estado', est ? T(est[0]) : x.estado], ['Pago', p ? T(p[0]) : T('Estado del pago desconocido')],
                 ['Precio', C.dinero(x.precio_total, x.moneda)]];
    if (x.hora) pares.push(['Hora', x.hora]);
    if (x.entrega_direccion) pares.push(['Dirección de entrega', x.entrega_direccion]);
    if (x.recogida_direccion) pares.push(['Dirección de recogida', x.recogida_direccion]);
    var acciones = E.puedeReservas ? [h('div', { class: 'axw-acciones' }, [h('a', { class: 'axw-boton', href: '/intranet/v4/reservas-producto/', text: T('Abrir Reservas de producto') })])] : [];
    C.dialogo(T('Reserva') + ' ' + (x.numero_reserva || ''), [C.resumen(pares)].concat(acciones),
              [{ texto: T('Cerrar'), accion: 'ph-cerrar', cierra: true }]);
  }
  function alClic(ev) {
    var el = ev.target.closest ? ev.target.closest('[data-accion]') : null;
    if (!el || !raiz.contains(el)) return;
    var a = el.getAttribute('data-accion');
    if (a === 'ph-hoy') carga(null);
    else if (a === 'ph-antes' && E.dia) carga(suma(E.dia, -1));
    else if (a === 'ph-despues' && E.dia) carga(suma(E.dia, 1));
    else if (a === 'ph-ver') { var x = E.filas[el.getAttribute('data-reserva-id')]; if (x) ver(x); }
  }
  function arranca() {
    if (!window.LW_AUTH || typeof window.LW_AUTH.then !== 'function') { error(T('Sin sesión: recarga la página o vuelve a entrar.')); return; }
    window.LW_AUTH.then(function (aut) {
      E.puedeReservas = tieneReservas(aut && aut.ficha);
      oculta($v('ir-reservas'), !E.puedeReservas);
      raiz.addEventListener('click', alClic); carga(null);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();
</script>
