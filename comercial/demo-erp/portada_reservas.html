<!-- Portada (/home/) de una instancia de tipo Reservas del ERP MAESTRO (11-oct-2026; plan único F8). Solo la llevan las instancias con `"portada": "reservas"` en
     erp/instancias.json; el resto (y Lawang) siguen con su Home. Brief literal del owner: «La Home debe ser directa al grano de las reservas de ese día, todo muy claro,
     modelo a entregar, cliente y estado del pago.»
     NO es una página entera: build.py (portada_reservas) la inyecta en la cáscara de /asistente/ de Lawang, como taller.html, y SIN puerta de herramienta: es la página de
     inicio de cualquiera que entra. Quien no tenga permiso de reservas ve que no puede verlas (no «hoy no hay»), y la base vuelve a exigirlo en la lectura.
     Qué hace: lee las entregas y las devoluciones de un día (por defecto, HOY en la zona horaria de la instancia: lo decide la base, no el reloj del navegador) y pinta,
     por reserva, el modelo, la unidad, el cliente y el estado del pago QUE DA LA BASE (`pago_estado`): la pantalla no calcula ni deduce nada de dinero. Tocar una
     reserva abre su ficha con lo que ya llegó. No escribe nada. Todo texto de la base se pinta con textContent. Se engancha por data-accion / data-ph, nunca por un rótulo.
     Idioma: ES/EN con el diccionario EN_PH de abajo más el de las ayudas comunes (se añaden a window.LW_EN solo si la clave no existe). -->

                                   function (e) { return { data: null, error: e }; });
  }

  var E = { dia: null, hoy: null, filas: {}, puedeReservas: false };
  // solo decide si se OFRECE el enlace; quien entra o no a la pantalla lo vuelve a decidir la base
  function tieneReservas(f) { return !!f && (f.rol === 'super_admin' || (Array.isArray(f.herramientas) && f.herramientas.indexOf('reservas-producto') !== -1)); }
  var DIA_RE = /^\d{4}-\d{2}-\d{2}$/;
  function fechaCon(s, op) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return '';
    // sin comas: id-ID da «Selasa, 13» y el titular ya pone la suya
    try { return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).toLocaleDateString(C.locale(), op).replace(/,/g, ''); } catch (e) { /* MUDO A PROPOSITO: sin Intl el titular dice Hoy y el antetítulo queda sin fecha */ return ''; }
  }
  function diaSemana(s) { return fechaCon(s, { weekday: 'long', day: 'numeric' }); }
  function mesDia(s) { return fechaCon(s, { day: 'numeric', month: 'long' }); }
  // Mover el día es aritmética de calendario sobre la fecha que dio la base (no se lee el reloj del navegador): mediodía UTC para que ningún cambio de hora salte un día.
  function suma(s, n) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    var d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12));
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function quien(x) {
    if (x.cliente_oculto) return T('Cliente sin permiso para verlo');
    return x.cliente ? String(x.cliente) : T('Sin cliente');
  }
  function chipDe(texto, tono, icono, cual) {
    return h('span', { class: 'axw-chip ph-chip', 'data-tono': tono, 'data-ph': cual }, [h('span', { class: 'material-symbols-outlined', 'aria-hidden': 'true', text: icono }), h('span', { text: texto })]);
  }
  function chipPago(x) {
    var p = PAGO[x.pago_estado];
    return p ? chipDe(T(p[0]), p[1], p[2], 'chip-pago') : chipDe(T('Estado del pago desconocido'), 'mal', 'help', 'chip-pago');
  }
  // Fila con la forma del diseño: hora (o «Sin hora»: la columna nunca queda vacía ni se deduce), modelo + matrícula, dirección de ESA lista, cliente, estado y pago.
  function fila(x, clave) {
    var horaEl;
    if (x.hora) horaEl = h('span', { class: 'ph-hora font-headline-sm', text: String(x.hora) });
    else horaEl = h('span', { class: 'ph-hora font-label-md uppercase', 'data-sin': '1', text: T('Sin hora') });
    var linea = h('span', { class: 'ph-linea' }, [h('span', { class: 'ph-modelo', text: x.producto ? String(x.producto) : '—' })]);
    if (x.unidad) linea.appendChild(h('span', { class: 'ph-mat font-label-md uppercase', text: String(x.unidad) }));
    linea.appendChild(h('span', { class: 'ph-ir material-symbols-outlined', 'aria-hidden': 'true', text: 'chevron_right' }));
    var dir = clave === 'entregas' ? x.entrega_direccion : x.recogida_direccion;
    var sitio = [];
    if (dir) sitio.push(h('span', { text: T(clave === 'entregas' ? 'Entrega' : 'Recogida') + ': ' }), h('strong', { text: String(dir) }), ' · ');
    sitio.push(T('Reserva') + ' ' + (x.numero_reserva ? String(x.numero_reserva) : '—'));
    var chips = h('span', { class: 'ph-chips' });
    var est = ESTADO[x.estado];
    if (est) chips.appendChild(chipDe(T(est[0]), est[1], est[2], 'chip-estado'));
    chips.appendChild(chipPago(x));
    var cuerpo = h('span', { class: 'ph-cuerpo' }, [linea,
      h('span', { class: 'ph-sitio' }, [h('span', { class: 'material-symbols-outlined', 'aria-hidden': 'true', text: dir ? 'location_on' : 'confirmation_number' }), h('span', null, sitio)]),
      h('span', { class: 'ph-sitio' }, [h('span', { class: 'material-symbols-outlined', 'aria-hidden': 'true', text: 'person' }), h('span', { text: quien(x) })]),
      chips]);
    E.filas[String(x.id)] = x;
    return h('li', null, [h('button', { class: 'ph-fila', type: 'button', 'data-accion': 'ph-ver', 'data-reserva-id': String(x.id), title: T('Pulsa para ver la ficha') }, [horaEl, cuerpo])]);
  }
  // Cifras de arriba: SOLO cuentas sobre las filas del día que dio la base (nada de importes). Lista recortada → «n+»: no es el total, y nunca «nada pendiente».
  function cuenta(n, recortada) { return String(n) + (recortada ? '+' : ''); }
  function sub(el, partes) { vacia(el); partes.forEach(function (p) { if (p) el.appendChild(p); }); }
  function cifras(d) {
    var me = d.hay_mas_entregas === true, md = d.hay_mas_devoluciones === true;
    var n = function (lista, f) { return lista.filter(f).length; };
    $v('c-entregas').textContent = cuenta(d.entregas.length, me);
    $v('c-devoluciones').textContent = cuenta(d.devoluciones.length, md);
    var sinConf = n(d.entregas, function (x) { return x.estado === 'bloqueo'; });
    var hechas = n(d.entregas, function (x) { return x.estado === 'en_curso' || x.estado === 'devuelta'; });
    sub($v('c-entregas-sub'), [sinConf || me ? chipDe(T('Sin confirmar: %n').replace('%n', cuenta(sinConf, me)), 'espera', 'schedule', 'c-sin-confirmar') : null,
      h('span', { text: T('Ya entregadas: %n').replace('%n', cuenta(hechas, me)) })]);
    var fuera = n(d.devoluciones, function (x) { return x.estado === 'en_curso'; });
    var vueltas = n(d.devoluciones, function (x) { return x.estado === 'devuelta'; });
    sub($v('c-devoluciones-sub'), [h('span', { text: T('En curso: %n').replace('%n', cuenta(fuera, md)) }), h('span', { text: T('Ya devueltas: %n').replace('%n', cuenta(vueltas, md)) })]);
    // una reserva que sale y vuelve el mismo día está en las dos listas: se cuenta una vez
    var vistas = {}, unicas = [];
    d.entregas.concat(d.devoluciones).forEach(function (x) { var k = String(x.id); if (!vistas[k]) { vistas[k] = 1; unicas.push(x); } });
    var rec = me || md;
    var pend = n(unicas, function (x) { return x.pago_estado === 'pendiente'; });
    var regis = n(unicas, function (x) { return x.pago_estado === 'registrado'; });
    var desc = n(unicas, function (x) { return !PAGO[x.pago_estado]; });
    var num = $v('c-pago');
    num.textContent = cuenta(pend, rec);
    if (pend) num.setAttribute('data-tono', 'espera'); else num.removeAttribute('data-tono');
    sub($v('c-pago-sub'), [regis ? chipDe(T('Pago registrado, sin confirmar: %n').replace('%n', cuenta(regis, rec)), 'registrado', 'schedule', 'c-registrado') : null,
      desc ? chipDe(T('Estado del pago desconocido: %n').replace('%n', cuenta(desc, rec)), 'mal', 'help', 'c-desconocido') : null,
      !pend && !regis && !desc && !rec ? h('span', { text: T('Nada pendiente de pago') }) : null]);
  }
  // Cargando o «no se ha podido mirar»: las cifras dicen «—», nunca 0
  function cifrasSinDato() {
    ['c-entregas', 'c-devoluciones', 'c-pago'].forEach(function (k) { $v(k).textContent = '—'; $v(k).removeAttribute('data-tono'); vacia($v(k + '-sub')); });
  }
  function pinta(clave, lista) {
    var ul = $v(clave), est = $v('estado-' + clave), n = $v('n-' + clave);
    vacia(ul);
    n.textContent = '(' + lista.length + ')';
    if (!lista.length) {
      est.className = 'axw-vacio';
      var esHoy = E.dia === E.hoy;
      est.textContent = clave === 'entregas' ? T(esHoy ? 'Hoy no hay entregas.' : 'Este día no hay entregas.') : T(esHoy ? 'Hoy no hay devoluciones.' : 'Este día no hay devoluciones.');
      // vacío con salida (Diseño, 13-oct): el mismo data-accion que «Día siguiente ›» de arriba
      est.appendChild(document.createTextNode(' '));
      est.appendChild(h('button', { class: 'axw-boton', type: 'button', 'data-accion': 'ph-despues', text: T('Día siguiente ›') }));
      return;
    }
    est.textContent = '';
    lista.forEach(function (x) { ul.appendChild(fila(x, clave)); });
  }
  function hayMas(clave, si) {
    var el = $v('mas-' + clave);
    vacia(el); oculta(el, !si);
    if (!si) return;
    el.appendChild(document.createTextNode(T('Hay más de las que caben aquí.') + ' '));
    if (E.puedeReservas) el.appendChild(h('a', { href: '/intranet/v4/reservas-producto/', text: T('Ábrelas en Reservas de producto') }));
  }
  function noSeHaPodido(r) {
    cifrasSinDato();
    var t = r.error ? C.mensaje(r.error, true, PROPIOS) : T('La base ha devuelto algo inesperado. No es que esté vacía: no se ha podido mirar.');
    ['entregas', 'devoluciones'].forEach(function (k) {
      vacia($v(k)); $v('n-' + k).textContent = ''; hayMas(k, false);
      var est = $v('estado-' + k); est.className = 'axw-error'; est.textContent = T('No se han podido mirar las reservas') + ': ' + t;
    });
  }
  var PETICION = 0;
  function carga(dia) {
    var yo = ++PETICION;
    error('');
    ['entregas', 'devoluciones'].forEach(function (k) { var est = $v('estado-' + k); est.className = 'axw-vacio'; est.textContent = T('Cargando…'); hayMas(k, false); });
    cifrasSinDato();
    return llama('portada_reservas_dia_datos', { p_dia: dia || null }).then(function (r) {
      if (yo !== PETICION) return;   // llegó tarde: ya se pidió otro día y ese manda
      var d = r.data;
      if (r.error || !d || !DIA_RE.test(String(d.dia || '')) || !Array.isArray(d.entregas) || !Array.isArray(d.devoluciones)) { noSeHaPodido(r); return; }
      E.dia = String(d.dia);
      if (!dia) E.hoy = E.dia;   // sin día pedido, la base contesta con HOY en la zona de la instancia
      E.filas = {};
      // Titular «Hoy, martes 13.» / otro día «miércoles 14.»; el mes va en el antetítulo. El día es el que dio la base, en el idioma de la página.
      var semana = diaSemana(E.dia), mes = mesDia(E.dia);
      $v('titulo').textContent = E.dia === E.hoy ? (semana ? T('Hoy, %dia.').replace('%dia', semana) : T('Hoy')) : (semana ? semana + '.' : C.fechaDia(E.dia));
      $v('ante').textContent = T('Seguimiento') + (mes ? ' · ' + mes : '');
      var bh = $v('dia').querySelector('[data-accion="ph-hoy"]');
      if (bh) bh.setAttribute('aria-pressed', E.dia === E.hoy ? 'true' : 'false');
      cifras(d);
      pinta('entregas', d.entregas);
      pinta('devoluciones', d.devoluciones);
      hayMas('entregas', d.hay_mas_entregas === true);
      hayMas('devoluciones', d.hay_mas_devoluciones === true);
      if (d.hay_mas_entregas === true) $v('n-entregas').textContent = '(' + d.entregas.length + '+)';
      if (d.hay_mas_devoluciones === true) $v('n-devoluciones').textContent = '(' + d.devoluciones.length + '+)';
    });
  }
  function ver(x) {
    var p = PAGO[x.pago_estado], est = ESTADO[x.estado];
    var pares = [['Reserva', x.numero_reserva], ['Modelo', x.producto], ['Unidad', x.unidad], ['Cliente', quien(x)],
                 ['Fechas', C.fechaDia(x.desde) + ' → ' + C.fechaDia(x.hasta)],
                 ['Estado', est ? T(est[0]) : x.estado], ['Pago', p ? T(p[0]) : T('Estado del pago desconocido')],
                 ['Precio', C.dinero(x.precio_total, x.moneda)]];
    if (x.hora) pares.push(['Hora', x.hora]);
    if (x.entrega_direccion) pares.push(['Dirección de entrega', x.entrega_direccion]);
    if (x.recogida_direccion) pares.push(['Dirección de recogida', x.recogida_direccion]);
    var acciones = E.puedeReservas ? [h('div', { class: 'axw-acciones' }, [h('a', { class: 'axw-boton', href: '/intranet/v4/reservas-producto/', text: T('Abrir Reservas de producto') })])] : [];
    C.dialogo(T('Reserva') + ' ' + (x.numero_reserva || ''), [C.resumen(pares)].concat(acciones),
              [{ texto: T('Cerrar'), accion: 'ph-cerrar', cierra: true }]);
  }
  function alClic(ev) {
    var el = ev.target.closest ? ev.target.closest('[data-accion]') : null;
    if (!el || !raiz.contains(el)) return;
    var a = el.getAttribute('data-accion');
    if (a === 'ph-hoy') carga(null);
    else if (a === 'ph-antes' && E.dia) carga(suma(E.dia, -1));
    else if (a === 'ph-despues' && E.dia) carga(suma(E.dia, 1));
    else if (a === 'ph-ver') { var x = E.filas[el.getAttribute('data-reserva-id')]; if (x) ver(x); }
  }
  function arranca() {
    if (!window.LW_AUTH || typeof window.LW_AUTH.then !== 'function') { error(T('Sin sesión: recarga la página o vuelve a entrar.')); return; }
    window.LW_AUTH.then(function (aut) {
      E.puedeReservas = tieneReservas(aut && aut.ficha);
      oculta($v('ir-reservas'), !E.puedeReservas);
      raiz.addEventListener('click', alClic); carga(null);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();
</script>
