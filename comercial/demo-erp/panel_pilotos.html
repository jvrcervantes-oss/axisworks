  // ── SVG: ayudas ───────────────────────────────────────────────────────────────────────────────

  function wrap(t, px, fs) {

    pal.forEach(function (p) {

/*==ESQUEMAS==*/

  function enlaceRol(r, cuerpo) {

  function bloquesSinCapitan() {

  // ── (a) el equipo: Tú → Aprobaciones → Capitán → especialistas por lo que pueden tocar ────────
  function medFicha(r, w, ancha) {
    var st = wrapx(estTxt(r), ancha ? w - 40 : w - 40, 12);

      var pw = anchoTxt(hito, 12, true) + 18;

        tx(58, y + 146, lp, 11.5, 'svg-t', 'start', 14.5);
      mids.push(y + 104 + hp / 2);
      y += 104 + hp + 26;
    });
    var ult = mids[mids.length - 1];
    o += linea([80, 66, 80, 104, 20, 104, 20, ult], id, true);
    mids.forEach(function (m) { o += linea([20, m, 42, m], id, false); });
    return svg(360, y, o, 'Mapa: tú arriba; debajo, tres negocios y, bajo cada uno, su piloto. Entre tú y cada piloto hay una flecha en los dos sentidos.', 'md:hidden');
  }

  // ── flechas entre pasos y los pequeños dibujos de los flujos ──────────────────────────────────
  var FLECHA_H = '<svg class="hidden md:block absolute top-1/2 -right-[14px] -translate-y-1/2 z-10" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="11" fill="#f8f9ff"/><path d="M6 11h9M12 7l4 4-4 4" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var FLECHA_V = '<svg class="md:hidden absolute left-1/2 -bottom-[15px] -translate-x-1/2 z-10" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="11" fill="#f8f9ff"/><path d="M11 6v9M7 12l4 4 4-4" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function pasos(f) {
    var n = f.pasos.length, cols = n >= 5 ? 'md:grid-cols-5' : (n === 4 ? 'md:grid-cols-4' : 'md:grid-cols-3');
    return '<ol class="grid gap-[22px] md:gap-[26px] grid-cols-1 ' + cols + ' mt-space-md">' + f.pasos.map(function (p, i) {
      var prev = p.estado === 'previsto';
      return '<li class="relative rounded-xl p-space-sm bg-surface-container-lowest shadow-sm' + (prev ? ' paso-prev' : '') + '" data-lw="paso-' + esc(f.id) + '-' + (i + 1) + '">' +
        '<div class="flex items-center gap-space-xs mb-1"><span class="w-6 h-6 rounded-full bg-surface-container text-on-surface font-label-sm text-label-sm flex items-center justify-center flex-none">' + (i + 1) + '</span>' +
        '<span class="actor act-' + esc(p.actor) + '">' + esc(p.quien) + '</span></div>' +
        '<p class="font-body-sm text-body-sm text-on-surface [overflow-wrap:anywhere]">' + esc(p.texto) + '</p>' +
        (prev ? '<div class="mt-1">' + chip('previsto', f.comprobado) + '</div>' : '') +
        (i < n - 1 ? FLECHA_H + FLECHA_V : '') + '</li>';
    }).join('') + '</ol>';
  }
  function barra(b) {
    var id = 'fb' + (++MARC), o = marcas(id);
    o += '<rect x="10" y="38" width="580" height="22" rx="11" fill="#d5f1df"/><rect x="416" y="38" width="174" height="22" rx="0" fill="#ffedbd"/><rect x="578" y="38" width="12" height="22" rx="6" fill="#ffedbd"/>';
    o += '<line x1="416" y1="30" x2="416" y2="68" stroke="#d9a400" stroke-width="2" stroke-dasharray="4 3"/><line x1="590" y1="30" x2="590" y2="68" stroke="#ba1a1a" stroke-width="2.4"/>';
    var t70 = b.tramos[0], t100 = b.tramos[1];
    o += tx(416, 22, [t70.etiqueta + ' · ' + (D.estados[t70.estado] || '')], 11.5, 'svg-b', 'middle');
    o += tx(590, 22, [t100.etiqueta], 12, 'svg-n', 'end');
    o += tx(10, 22, ['0 €'], 11.5, 'svg-b');
    return svg(600, 76, o, b.titulo + ': a ' + t70.etiqueta + ' un aviso propuesto (no decidido); a ' + t100.etiqueta + ' el Tesorero recorta.', '');
  }
  function linea90(f) {
    var id = 'ft' + (++MARC), o = marcas(id), neg = f.pasos[2], pos = f.pasos[3];
    o += '<line x1="30" y1="70" x2="300" y2="70" stroke="#4f46e5" stroke-width="2"/>';
    for (var k = 1; k < 9; k++) o += '<line x1="' + (30 + k * 30) + '" y1="65" x2="' + (30 + k * 30) + '" y2="75" stroke="#9a98ab"/>';
    o += '<circle cx="30" cy="70" r="8" fill="#4f46e5"/><circle cx="300" cy="70" r="8" fill="#fff" stroke="#4f46e5" stroke-width="3"/>';
    o += tx(30, 100, [f.pasos[0].quien], 12, 'svg-n', 'middle') + tx(300, 100, ['Día 90'], 12, 'svg-n', 'middle') + tx(165, 54, [f.pasos[1].quien.toLowerCase() + ': ganado − gastado'], 11, 'svg-b', 'middle');
    o += linea([308, 66, 350, 66, 350, 28, 380, 28], id, false) + linea([308, 74, 350, 74, 350, 112, 380, 112], id, false);
    o += caja(382, 8, 208, 40, { fill: '#d5f1df', stroke: '#1f8f4f', r: 10 }) + tx(486, 33, ['Positivo: gana más autonomía'], 11.5, 'svg-t', 'middle');
    o += caja(382, 92, 208, 40, { fill: '#ffdad6', stroke: '#ba1a1a', r: 10 }) + tx(486, 117, ['Cero o negativo: se apaga'], 11.5, 'svg-t', 'middle');
    return svg(600, 140, o, 'Línea de tiempo: día 0 primera venta real; cada día el Tesorero mide; en el día 90, si el resultado es positivo el piloto gana autonomía y si es cero o negativo se apaga.', '');
  }

  // ── secciones ─────────────────────────────────────────────────────────────────────────────────
  function titulo(t, sub) {
    return '<div><h2 class="font-headline-sm text-headline-sm font-bold text-on-surface">' + esc(t) + '</h2>' +
      (sub ? '<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">' + esc(sub) + '</p>' : '') + '</div>';
  }
  function filaNecesita(it, nivel) {
    var N = D.necesitan, E = N.etiquetas;
    var cod = it.codigos + (it.abiertos && it.abiertos.length && it.desde ? ' · abierta desde ' + fechaCorta(it.desde) : '') + (it.sin_fila ? ' · ' + N.sin_fila : '');
    return '<li data-lw="necesita-' + it.n + '" class="rounded-xl p-space-md bg-surface-container-lowest shadow-sm flex gap-space-sm">' +
      '<span class="semaforo sem-' + esc(nivel) + '" aria-hidden="true"></span><div class="min-w-0 flex-1">' +
      '<h3 class="font-label-md text-label-md font-bold text-on-surface text-[15px] leading-snug">' + esc(it.que) + '</h3>' +
      '<dl class="mt-1 space-y-1 font-body-sm text-body-sm">' +
      [['por_que', it.por_que], ['cuesta', it.cuesta], ['desbloquea', it.desbloquea]].map(function (par) {
        return '<div class="grid grid-cols-1 sm:grid-cols-[104px_1fr] sm:gap-space-sm"><dt class="font-label-sm text-label-sm text-outline uppercase tracking-wide">' + esc(E[par[0]]) + '</dt><dd class="text-on-surface [overflow-wrap:anywhere]">' + esc(par[1]) + '</dd></div>';
      }).join('') + '</dl>' +
      (it.nota ? '<p class="mt-1 font-body-sm text-body-sm text-on-surface-variant [overflow-wrap:anywhere]">' + esc(it.nota) + '</p>' : '') +
      '<p class="cod mt-1">' + esc(cod) + '</p></div></li>';
  }
  function secNecesitan() {
    var N = D.necesitan, ROT = { rojo: '🔴', amarillo: '🟡', verde: '🟢' };
    var cuerpo = N.niveles.filter(function (v) { return v.items.length; }).map(function (v) {
      return '<section data-lw="nivel-' + esc(v.id) + '"><h3 class="font-label-md text-label-md font-bold text-on-surface mb-space-sm flex items-center gap-space-xs"><span aria-hidden="true">' + (ROT[v.id] || '') + '</span>' + esc(v.titulo) + '</h3>' +
        '<ul class="space-y-space-sm">' + v.items.map(function (it) { return filaNecesita(it, v.id); }).join('') + '</ul></section>';
    }).join('');
    return '<section id="necesitan" data-lw="seccion-necesitan" class="space-y-space-md">' + titulo(N.titulo, N.subtitulo) +
      '<p class="font-label-md text-label-md text-on-surface-variant">' + esc(N.leyenda) + '</p>' + (cuerpo || '<p class="p-space-md rounded-xl bg-surface-container-lowest text-on-surface-variant">Nada pendiente de ti en la lista.</p>') +
      (N.otras_del_libro ? '<p class="viejo">Hay ' + N.otras_del_libro + (N.otras_del_libro === 1 ? ' fila más tuya' : ' filas más tuyas') + ' de BodaEnlace en el libro del estudio que no se explican aquí.</p>' : '') +
      '<p class="font-body-sm text-body-sm text-on-surface-variant">' + esc(N.pie) + '</p></section>';
  }
  function secMapa() {
    var M = D.mapa, A = D.ayudantes;
    return '<section id="mapa" data-lw="seccion-mapa" class="space-y-space-md">' + titulo(M.titulo) +
      '<div class="rounded-xl bg-surface-container-lowest shadow-sm p-space-sm">' + mapaSvg(true) + mapaSvg(false) + '</div>' +
      '<div class="grid gap-space-sm md:grid-cols-3">' + M.negocios.map(function (b) {
        return '<div class="rounded-xl p-space-md bg-surface-container-lowest shadow-sm" data-lw="negocio-' + esc(b.id) + '"><div class="flex items-start justify-between gap-space-xs"><h3 class="font-label-md text-label-md font-bold">' + esc(b.nombre) + '</h3>' + chip(b.estado, b.comprobado) + '</div>' +
          '<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">' + esc(b.texto) + '</p></div>';
      }).join('') + '</div>' +
      '<p class="font-body-sm text-body-sm text-on-surface-variant">' + esc(M.nota) + '</p>' +
      '<div data-lw="ayudantes" class="rounded-xl p-space-md" style="background:#d6f6fc"><h3 class="font-label-md text-label-md font-bold" style="color:#003a46">' + esc(A.titulo) + '</h3>' +
      '<p class="font-body-sm text-body-sm" style="color:#003a46">' + esc(A.linea) + '</p>' +
      '<p class="viejo" style="color:#3d5560">' + esc(A.aviso) + '</p>' +
      '<div class="grid gap-space-sm sm:grid-cols-2 lg:grid-cols-3 mt-space-sm">' + A.items.map(function (a) {
        return '<div class="rounded-lg p-space-sm bg-surface-container-lowest" data-lw="ayudante-' + esc(a.id) + '"><div class="font-label-md text-label-md font-bold">' + esc(a.nombre) + '</div>' +
          '<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">' + esc(a.hace) + '</p><div class="mt-1">' + chip(a.estado, a.comprobado) + '</div></div>';
      }).join('') + '</div></div></section>';
  }
  function tarjetaRol(r, L) {
    return '<article id="rol-' + esc(r.id) + '" data-lw="rol-' + esc(r.id) + '" class="rounded-xl p-space-md bg-surface-container-lowest shadow-sm">' +
      '<div class="flex flex-wrap items-center justify-between gap-space-xs"><h3 class="font-headline-sm text-[18px] font-bold">' + esc(r.nombre) + (r.subtitulo ? '<span class="block font-label-sm text-label-sm text-on-surface-variant">' + esc(r.subtitulo) + '</span>' : '') + '</h3><div>' + chip(r.estado, r.comprobado) + '</div></div>' +
      (r.nota_estado ? '<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 [overflow-wrap:anywhere]">' + esc(r.nota_estado) + '</p>' : '') +
      '<p class="font-label-sm text-label-sm text-outline uppercase tracking-wide mt-space-sm">' + esc(L.hace) + '</p><p class="font-body-sm text-body-sm [overflow-wrap:anywhere]">' + esc(r.hace) + '</p>' +
      '<p class="font-label-sm text-label-sm text-outline uppercase tracking-wide mt-space-xs">' + esc(L.llaves) + '</p><p class="font-body-sm text-body-sm [overflow-wrap:anywhere]">' + esc(r.llaves) + '</p>' +
      (r.entra ? '<p class="font-label-sm text-label-sm text-outline uppercase tracking-wide mt-space-xs">' + esc(L.entra) + '</p><p class="font-body-sm text-body-sm [overflow-wrap:anywhere]">' + esc(r.entra) + '</p>' : '') +
      '<details class="mt-space-sm"><summary class="flex items-center gap-1 font-label-md text-label-md text-primary-container"><span class="material-symbols-outlined text-[18px] chev" aria-hidden="true">expand_more</span>' + esc(L.no_puede) + '</summary>' +
      '<p class="font-body-sm text-body-sm mt-space-xs [overflow-wrap:anywhere]">' + esc(r.no_puede) + '</p></details></article>';
  }
  function secEquipo() {
    var E = D.equipo, L = E.etiquetas;
    return '<section id="equipo" data-lw="seccion-equipo" class="space-y-space-md">' + titulo(E.titulo, E.intro) +
      '<div class="rounded-xl bg-surface-container-lowest shadow-sm p-space-sm">' + equipoSvg(true) + equipoSvg(false) + '</div>' +
      '<div class="grid gap-space-sm md:grid-cols-2">' + E.roles.map(function (r) { return tarjetaRol(r, L); }).join('') + '</div></section>';
  }
  function secMaquinaria() {
    var M = D.maquinaria, L = D.equipo.etiquetas;
    return '<section id="maquinaria" data-lw="seccion-maquinaria" class="space-y-space-md rounded-xl p-space-md" style="background:#e9ecf5">' + titulo(M.titulo, M.linea) +
      '<div class="grid gap-space-sm md:grid-cols-2">' + M.items.map(function (r) { return tarjetaRol(r, L); }).join('') + '</div></section>';
  }
  function articuloApuesta(A) {
    var s = apuestaSvg(true);
    if (!A || !s) return '';
    return '<article id="flujo-apuesta" data-lw="flujo-apuesta" class="esq-art rounded-xl p-space-md bg-surface-container-low">' +
      '<div class="min-w-0"><h3 class="font-headline-sm text-[18px] font-bold leading-snug">' + esc(A.titulo) + '</h3><p class="font-body-sm text-body-sm text-on-surface-variant mt-1">' + esc(A.linea) + '</p></div>' +
      '<div class="esq-wrap mt-space-md rounded-xl bg-surface-container-lowest shadow-sm p-space-sm">' + s + apuestaSvg(false) + '</div>' +
      '<div class="mt-space-sm flex flex-wrap items-baseline gap-space-xs">' + chip(A.estado, A.comprobado) + '<span class="font-body-sm text-body-sm text-on-surface-variant [overflow-wrap:anywhere]">' + esc(A.estado_txt) + '</span></div></article>';
  }
  function secFlujos() {
    var F = D.flujos;
    return '<section id="flujos" data-lw="seccion-flujos" class="space-y-space-lg">' + titulo(F.titulo) +
      '<p class="font-body-sm text-body-sm text-on-surface-variant flex flex-wrap items-center gap-x-space-sm gap-y-1">' + Object.keys(F.actores).map(function (k) { return '<span class="actor act-' + esc(k) + '">' + esc(F.actores[k]) + '</span>'; }).join('') + '</p>' +
      articuloApuesta(F.apuesta) +
      F.items.map(function (f) {
        return '<article id="flujo-' + esc(f.id) + '" data-lw="flujo-' + esc(f.id) + '" class="' + (f.id === 'C' ? 'esq-art ' : '') + 'rounded-xl p-space-md bg-surface-container-low">' +
          '<div class="flex items-start gap-space-sm"><span class="w-9 h-9 rounded-full bg-primary-container text-on-primary font-headline-sm text-[16px] font-bold flex items-center justify-center flex-none" aria-hidden="true">' + esc(f.id) + '</span>' +
          '<div class="min-w-0"><h3 class="font-headline-sm text-[18px] font-bold leading-snug">' + esc(f.titulo) + '</h3><p class="font-body-sm text-body-sm text-on-surface-variant mt-1">' + esc(f.linea) + '</p></div></div>' +
          (f.id === 'C' && cambioSvg(true) ? '<div class="esq-wrap mt-space-md rounded-xl bg-surface-container-lowest shadow-sm p-space-sm">' + cambioSvg(true) + cambioSvg(false) + '</div>' : pasos(f)) +
          (f.id === 'E' ? '<div class="mt-space-md rounded-xl bg-surface-container-lowest p-space-sm max-w-[640px]">' + linea90(f) + '</div>' : '') +
          (f.cajas ? '<div class="grid gap-space-sm md:grid-cols-2 mt-space-md">' + f.cajas.map(function (c) {
            return '<div class="rounded-xl p-space-sm bg-surface-container-lowest"><div class="font-label-md text-label-md font-bold">' + esc(c.titulo) + '</div><p class="font-body-sm text-body-sm mt-1 [overflow-wrap:anywhere]">' + esc(c.texto) + '</p></div>';
          }).join('') + '</div>' : '') +
          (f.barra ? '<div class="mt-space-md rounded-xl bg-surface-container-lowest p-space-sm"><div class="font-label-md text-label-md font-bold mb-1">' + esc(f.barra.titulo) + '</div><div class="max-w-[640px]">' + barra(f.barra) + '</div>' +
            '<ul class="mt-space-sm space-y-1 font-body-sm text-body-sm">' + f.barra.tramos.map(function (t) {
              return '<li class="flex flex-wrap items-baseline gap-x-space-xs"><strong>' + esc(t.etiqueta) + '</strong>' + (t.estado === 'propuesta' ? chip('propuesta', f.comprobado) : '') + '<span class="[overflow-wrap:anywhere]">' + esc(t.texto) + '</span></li>';
            }).join('') + '<li class="text-on-surface-variant [overflow-wrap:anywhere]">' + esc(f.barra.extra) + '</li></ul></div>' : '') +
          (f.porque ? '<p class="mt-space-md font-label-md text-label-md font-bold text-on-surface">' + esc(f.porque) + '</p>' : '') +
          '<div class="mt-space-sm space-y-1">' + (f.estados || [{ estado: f.estado, texto: f.estado_txt }]).map(function (e) {
            return '<div class="flex flex-wrap items-baseline gap-space-xs">' + chip(e.estado, f.comprobado) + '<span class="font-body-sm text-body-sm text-on-surface-variant [overflow-wrap:anywhere]">' + esc(e.texto) + '</span></div>';
          }).join('') + '</div></article>';
      }).join('') + '</section>';
  }
  function secPie() {
    var P = D.pie;
    return '<section data-lw="seccion-pie" class="space-y-space-sm">' + titulo(P.titulo) +
      '<dl class="rounded-xl bg-surface-container-lowest shadow-sm divide-y divide-outline-variant/50">' + P.filas.map(function (f) {
        return '<div class="p-space-sm grid sm:grid-cols-[220px_1fr] gap-x-space-sm"><dt class="font-label-md text-label-md font-bold">' + esc(f.parte) + '</dt><dd class="font-body-sm text-body-sm text-on-surface-variant">' + esc(f.como) + '</dd></div>';
      }).join('') + '</dl><p class="font-body-sm text-body-sm text-on-surface-variant">' + esc(P.nota) + '</p></section>';
  }

  function pinta() {
    var C = D.cabecera, gen = D.generado, d = dias(gen), viejo = d != null && d > 14;
    $('sello').innerHTML = esc(C.sello + ' ' + fechaLarga(gen)) + (viejo ? '<span class="block text-error">Sin actualizar desde hace ' + d + ' días</span>' : '');
    $('estado-carga').classList.add('hidden');
    var v = $('vista');
    v.classList.remove('hidden');
    v.innerHTML =
      '<section data-lw="cabecera" class="space-y-space-sm"><p class="font-body-md text-body-md text-on-surface-variant">' + esc(C.subtitulo) + '</p>' +
      '<div class="rounded-xl p-space-md bg-primary-container text-on-primary [overflow-wrap:anywhere]" style="font-size:17px;line-height:26px">' + esc(C.caja) + '</div></section>' +
      secNecesitan() + secMapa() + secEquipo() + secMaquinaria() + secFlujos() + secPie();
    if (location.hash.length > 1) { var t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
  }

  function pide() {
    return sb.auth.getSession().then(function (s) {
      var t = s && s.data && s.data.session && s.data.session.access_token;
      return fetch(window.lwEdge('erp-control'), { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (t || '') }, body: JSON.stringify({ accion: 'pilotos' }) });
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d.__estado = r.status; return d; }); });
  }
  function carga() {
    var c = $('estado-carga');
    c.classList.remove('hidden'); c.textContent = 'Cargando…';
    return pide().then(function (d) {
      if (d.__estado === 403) throw new Error('Tu cuenta no es operadora del panel de control.');
      if (d.__estado !== 200 || !d.pilotos || typeof d.pilotos !== 'object') throw new Error('No se ha podido leer esta vista (' + d.__estado + '). No es que no haya nada: no he podido mirar.');
      D = d.pilotos;
      pinta();
    }).catch(function (e) {
      $('vista').classList.add('hidden');
      c.classList.remove('hidden');
      c.innerHTML = esc(e.message || 'No se pudo cargar.') + ' <button type="button" data-accion="reintenta" class="underline font-label-md">Reintentar</button>';
    });
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest && ev.target.closest('[data-accion]');
    if (!t) return;
    var a = t.getAttribute('data-accion');
    if (a === 'reintenta') carga();
    else if (a === 'ir-rol') { var r = document.getElementById('rol-' + t.getAttribute('data-rol')); if (r) { ev.preventDefault(); r.scrollIntoView({ behavior: 'smooth', block: 'center' }); var dt = r.querySelector('details'); if (dt) dt.open = true; } }
  });
  window.LW_AUTH.then(function (a) {
    sb = a.sb;
    $('operador').textContent = (a.session && a.session.user && a.session.user.email) || '—';
    return carga();
  }).catch(function (e) {
    $('estado-carga').textContent = (e && e.message) || 'No se pudo cargar.';
  });
})();
</script>
</body>
